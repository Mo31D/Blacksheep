<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commerce email staging verification</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#171713}label{display:block;margin:16px 0 6px;font-weight:700}input{width:100%;max-width:420px;padding:10px;font:inherit}button{margin-top:18px;padding:12px 18px;font-weight:700}pre{white-space:pre-wrap;background:#f4f1e9;padding:16px;border-radius:12px}.ok{color:#176b36}.bad{color:#a12b20}</style></head><body><h1>Black Sheep staging email check</h1><p>This creates one staging order, sends the owner notification and customer acknowledgement, then repeats the same request to verify idempotency. No payment is taken.</p><label for="email">Customer test email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><div id="turnstile" style="margin-top:18px"></div><button id="run" disabled>Run staging email test</button><pre id="result">Waiting for security verification…</pre><script>const API='https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev';let token='';const button=document.getElementById('run'),result=document.getElementById('result'),email=document.getElementById('email');async function run(){const customerEmail=email.value.trim();if(!customerEmail||!email.checkValidity()){result.className='bad';result.textContent='Enter a valid customer test email.';return}button.disabled=true;result.className='';result.textContent='Running…';const key=crypto.randomUUID();const payload={turnstileToken:token,fulfilmentMethod:'collection',customer:{name:'Black Sheep Email Test',email:customerEmail},items:[{productId:'HC-003',quantity:1}]};try{const firstResponse=await fetch(API+'/v1/orders',{method:'POST',headers:{'content-type':'application/json','idempotency-key':key},body:JSON.stringify(payload)});const first=await firstResponse.json();const secondResponse=await fetch(API+'/v1/orders',{method:'POST',headers:{'content-type':'application/json','idempotency-key':key},body:JSON.stringify(payload)});const second=await secondResponse.json();const ref1=first?.order?.reference||'';const ref2=second?.order?.reference||'';const pass=firstResponse.status===201&&secondResponse.status===200&&ref1&&ref1===ref2&&second?.idempotentReplay===true;result.className=pass?'ok':'bad';result.textContent=(pass?'ORDER PASS — EMAIL DELIVERY NOT VERIFIED':'FAIL')+'\nFirst: HTTP '+firstResponse.status+' · '+ref1+'\nRetry: HTTP '+secondResponse.status+' · '+ref2+' · idempotentReplay='+String(second?.idempotentReplay)+'\n\nIf the order passes, email delivery still requires separate confirmation in D1/Resend Logs.\n\n'+JSON.stringify({first,second},null,2)}catch(error){result.className='bad';result.textContent='FAIL\n'+String(error)}finally{try{turnstile.reset()}catch{}}}button.addEventListener('click',run);function ready(value){token=value;button.disabled=false;result.textContent='Security verified. Enter a test email and press Run staging email test.'}window.onload=()=>turnstile.render('#turnstile',{sitekey:'0x4AAAAAAFChkRt-LzNQw9bK',action:'order_request',callback:ready,'expired-callback':()=>{token='';button.disabled=true}});</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script></body></html>
