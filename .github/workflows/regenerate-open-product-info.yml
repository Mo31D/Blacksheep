name: Regenerate open product information
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-icecream.mjs
      - run: node scripts/build-romneys.mjs
      - run: node scripts/verify-search-readiness.mjs
      - name: Commit generated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: open product information by default"
            git push origin HEAD:main
          fi
