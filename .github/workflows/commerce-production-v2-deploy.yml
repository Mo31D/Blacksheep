name: Commerce Production V2 Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-production-v2-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ecc05a588cbb2a07210661d4c34cf5b9bb8afb62

    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@v4
        with:
          ref: ecc05a588cbb2a07210661d4c34cf5b9bb8afb62
          fetch-depth: 1

      - name: Verify pinned release SHA
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected: $RELEASE_SHA"
          echo "Actual:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Re-run release checks
        run: npm run check

      - name: Require production migrations already complete
        shell: bash
        run: |
          OUTPUT="$(npm run db:migrations:list:production 2>&1)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No migrations to apply"

      - name: Deploy pinned Worker source only
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const failures = [];
          if (health.status !== "ok") failures.push("status");
          if (health.environment !== "production") failures.push("environment");
          if (health.database !== "bound") failures.push("database");
          if (health.notifications?.provider !== "resend") failures.push("provider");
          if (health.notifications?.fromConfigured !== true) failures.push("fromConfigured");
          if (health.notifications?.webhookConfigured !== true) failures.push("webhookConfigured");
          if (health.notifications?.keyFormatValid !== true) failures.push("keyFormatValid");
          if (health.notifications?.keyWhitespaceNormalized !== true) failures.push("keyWhitespaceNormalized");
          if (failures.length) {
            console.error("Production health gate failed:", failures.join(", "));
            process.exit(1);
          }
          console.log("Production health gate passed.");
          NODE

      - name: Verify production Admin page
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/admin > /tmp/admin.html
          test -s /tmp/admin.html
          grep -qi "Black Sheep" /tmp/admin.html
          echo "Production Admin page is reachable."

      - name: Record production deployment status
        run: npx wrangler deployments status --json

      - name: Safety statement
        if: always()
        run: |
          echo "Pinned source: $RELEASE_SHA"
          echo "This workflow performs Worker deploy only."
          echo "It does not apply production migrations."
          echo "This release does not change the enabled production Resend webhook configuration."
