name: Commerce Staging Admin Browser QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-staging-admin-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Install ephemeral browser QA dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Actions credentials are unavailable."
            exit 1
          fi

      - name: Confirm staging schema is current
        run: npm run db:migrations:list:staging

      - name: Run Admin UI browser QA
        run: node scripts/staging-admin-browser-qa.mjs

      - name: Upload Admin UI QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-admin-browser-qa
          path: commerce/admin-browser-qa-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Production safety statement
        if: always()
        run: |
          echo "This workflow targets only the staging Worker and black-sheep-commerce-staging D1."
          echo "Synthetic staging order/session records are used for QA and cleaned after success."
          echo "No production Worker deploy, production D1 migration or production write command is present."
