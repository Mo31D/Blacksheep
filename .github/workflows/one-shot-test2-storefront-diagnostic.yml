name: One-shot Test 2 Storefront Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-test2-storefront-diagnostic.yml"

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install dependencies
        working-directory: commerce
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Compare Test 2 across Production API and D1 databases
        working-directory: commerce
        run: |
          echo "=== PUBLIC API ==="
          curl --fail --silent --show-error --max-time 30 \
            "https://api.theblacksheepshop.co.uk/v1/catalog?q=test&limit=200" \
            | tee /tmp/public-test.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const body=JSON.parse(fs.readFileSync("/tmp/public-test.json","utf8"));
          console.log(JSON.stringify({
            count:(body.products||[]).length,
            matches:(body.products||[]).map(p=>({
              id:p.id,productId:p.productId,slug:p.slug,name:p.name,type:p.type,
              primaryCategory:p.primaryCategory,categories:p.categories,
              priceMinor:p.priceMinor,status:p.status,purchasable:p.purchasable,
              image:p.primaryImageUrl
            }))
          },null,2));
          NODE

          echo "=== PRODUCTION D1 c1af / black-sheep-commerce-prod ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote \
            --command "SELECT p.id,p.current_slug,p.publication_status,p.current_published_version_id,p.updated_at,pv.title,pv.product_type FROM products p LEFT JOIN product_versions pv ON pv.id=p.current_published_version_id WHERE LOWER(COALESCE(pv.title,'')) LIKE '%test%' OR LOWER(p.current_slug) LIKE '%test%' ORDER BY p.updated_at DESC;"

          echo "=== STAGING D1 d442 / black-sheep-commerce-staging ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-staging --remote --env staging \
            --command "SELECT p.id,p.current_slug,p.publication_status,p.current_published_version_id,p.updated_at,pv.title,pv.product_type FROM products p LEFT JOIN product_versions pv ON pv.id=p.current_published_version_id WHERE LOWER(COALESCE(pv.title,'')) LIKE '%test%' OR LOWER(p.current_slug) LIKE '%test%' ORDER BY p.updated_at DESC;"

          echo "=== PRODUCT COUNTS ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote \
            --command "SELECT COUNT(*) AS total_products, SUM(CASE WHEN publication_status='ACTIVE' AND current_published_version_id IS NOT NULL THEN 1 ELSE 0 END) AS active_published FROM products;"
          npx --no-install wrangler d1 execute black-sheep-commerce-staging --remote --env staging \
            --command "SELECT COUNT(*) AS total_products, SUM(CASE WHEN publication_status='ACTIVE' AND current_published_version_id IS NOT NULL THEN 1 ELSE 0 END) AS active_published FROM products;"

      - name: Verify Test 2 in live storefront browser
        working-directory: commerce
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const SITE="https://theblacksheepshop.co.uk";
          const API="https://api.theblacksheepshop.co.uk";
          const response=await fetch(API+"/v1/catalog?q=test&limit=200",{headers:{accept:"application/json"}});
          if(!response.ok)throw new Error("API "+response.status);
          const payload=await response.json();
          const product=(payload.products||[]).find(p=>String(p.name).trim().toLowerCase()==="test 2");
          console.log("API Test 2:",JSON.stringify(product,null,2));
          if(!product)throw new Error("Test 2 is absent from current public API");
          const browser=await chromium.launch();
          const context=await browser.newContext({viewport:{width:1024,height:1366}});
          const page=await context.newPage();
          try{
            for(const path of ["/all-products.html","/gifts-highland-cows.html"]){
              await page.goto(SITE+path+"?diagnostic="+Date.now(),{waitUntil:"domcontentloaded",timeout:60000});
              await page.waitForFunction(()=>["ready","fallback"].includes(document.documentElement.dataset.commerceLive),null,{timeout:30000}).catch(()=>{});
              const info=await page.evaluate((slug)=>({
                state:window.BLACK_SHEEP_LIVE_COMMERCE_STATE||null,
                cards:[...document.querySelectorAll(".product-card")].filter(c=>{
                  const t=(c.querySelector(".product-title")?.textContent||"").trim().toLowerCase();
                  return t==="test 2" || String(c.dataset.productSlug||"")===slug;
                }).map(c=>({
                  title:(c.querySelector(".product-title")?.textContent||"").trim(),
                  url:c.dataset.url||c.querySelector(".product-title")?.getAttribute("href"),
                  categories:c.dataset.categories||"",
                  display:getComputedStyle(c).display
                }))
              }),product.slug);
              console.log(path,JSON.stringify(info,null,2));
            }
          }finally{
            await context.close();
            await browser.close();
          }
          NODE

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESC="Test 2 storefront diagnostic completed"
          else
            STATE="failure"
            DESC="Test 2 storefront diagnostic found a failure"
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"test2-storefront-diagnostic\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
