name: One-shot Production Stock Value Hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-production-stock-value-hotfix.yml"

permissions:
  contents: read

concurrency:
  group: black-sheep-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate release
        run: npm run check
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy production
        run: npm run deploy:production
      - name: Verify production health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 "https://api.theblacksheepshop.co.uk/health" | tee /tmp/health.json
          node <<'NODE'
          const fs = require("fs");
          const h = JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          if (h.status !== "ok") throw new Error("Production health is not ok");
          if (h.environment !== "production") throw new Error("Wrong production environment marker");
          if (h.database !== "bound") throw new Error("Production database is not bound");
          console.log("Production health verified.");
          NODE
      - name: Verify public catalogue
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 "https://api.theblacksheepshop.co.uk/v1/catalog?limit=1" | tee /tmp/catalog.json
          node <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/catalog.json","utf8"));
          if (!Array.isArray(body.products)) throw new Error("Invalid production catalogue payload");
          console.log("Production catalogue verified.");
          NODE
