name: One-shot Stock Value Production Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-stock-value-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: black-sheep-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Full pre-production validation
        run: npm run check

      - name: Record production migrations before deploy
        run: npm run db:migrations:list:production

      - name: Apply production migrations
        run: npm run db:migrate:production

      - name: Confirm production migrations after apply
        run: npm run db:migrations:list:production

      - name: Verify production valuation schema
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command             "SELECT category_type FROM categories LIMIT 0; SELECT cost_minor, supplier_id, supplier_product_code, vat_rate_basis_points FROM product_variants LIMIT 0; SELECT id, name, active FROM suppliers LIMIT 0; SELECT snapshot_date, location_id, cost_value_inc_vat_minor, retail_value_inc_vat_minor, potential_gross_profit_minor FROM inventory_valuation_snapshots LIMIT 0;"
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command             "SELECT COUNT(*) AS products FROM products; SELECT COUNT(*) AS tracked_variants FROM product_variants WHERE active=1 AND track_inventory=1; SELECT COUNT(*) AS suppliers FROM suppliers;"

      - name: Deploy production Worker
        run: npx wrangler deploy

      - name: Record deployed production Worker state
        run: |
          npx wrangler deployments status --json
          npx wrangler deployments list

      - name: Verify production health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20             "https://api.theblacksheepshop.co.uk/health" | tee /tmp/production-health.json
          node <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync("/tmp/production-health.json", "utf8"));
          if (health.status !== "ok") throw new Error("production health status is not ok");
          if (health.environment !== "production") throw new Error("production environment marker is incorrect");
          if (health.database !== "bound") throw new Error("production D1 binding is not active");
          if (health.features?.commerceAuthority !== true) throw new Error("production commerce authority is not active");
          console.log("Production health verified.");
          NODE

      - name: Verify public catalogue still responds
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20             "https://api.theblacksheepshop.co.uk/v1/catalog?limit=1" | tee /tmp/production-catalog.json
          node <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/production-catalog.json", "utf8"));
          if (!Array.isArray(body.products)) throw new Error("production catalogue payload is invalid");
          console.log("Production public catalogue verified.");
          NODE

      - name: Deployment statement
        if: always()
        run: |
          echo "This workflow is the explicitly authorized Stock Value production release."
          echo "It applies forward-only schema migrations before the Worker deploy."
          echo "It does not import, overwrite, delete or reset Product Core or Inventory data."
