name: Phase 6 Production Cutover

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CUTOVER-PRODUCTION-D1 to authorize the irreversible Production cutover"
        required: true
        type: string
      expected_package_sha:
        description: "Approved 64-character publication package SHA-256 from the latest readiness run"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: black-sheep-phase6-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_R2_BUCKET: black-sheep-product-media-prod

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Require explicit cutover authorization
        shell: bash
        working-directory: .
        run: |
          if [ "${{ inputs.confirmation }}" != "CUTOVER-PRODUCTION-D1" ]; then
            echo "::error::Production cutover blocked. Exact confirmation is required."
            exit 1
          fi
          if ! printf '%s' "${{ inputs.expected_package_sha }}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_package_sha must be a 64-character lowercase SHA-256."
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require unchanged main and pre-cutover source
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced after this workflow started. Re-run readiness and cutover from the new head."
            exit 1
          fi
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const vars = config.vars || {};
          const r2 = config.r2_buckets || [];
          const site = fs.readFileSync("../assets/site.js", "utf8");
          const failures = [];
          if (vars.D1_PUBLIC_CATALOG_ENABLED === "true") failures.push("D1_PUBLIC_CATALOG_ENABLED already enabled");
          if (vars.D1_COMMERCE_AUTHORITY_ENABLED === "true") failures.push("D1_COMMERCE_AUTHORITY_ENABLED already enabled");
          if (vars.ORDER_RESERVATIONS_ENABLED === "true") failures.push("ORDER_RESERVATIONS_ENABLED already enabled");
          if (r2.some((binding) => binding.binding === "PRODUCT_MEDIA")) failures.push("PRODUCT_MEDIA already bound");
          if (!site.includes("const BLACK_SHEEP_PRODUCTION_LIVE_COMMERCE=false;")) {
            failures.push("Production live-commerce marker is not disabled");
          }
          if (failures.length) {
            console.error("Source is not in the approved pre-cutover state.", failures);
            process.exit(1);
          }
          console.log("Pre-cutover source gate passed.");
          NODE

      - name: Run full pre-cutover Commerce validation
        run: npm run check

      - name: Rebuild approved staging package before any Production write
        shell: bash
        run: |
          mkdir -p /tmp/phase6-preflight
          node scripts/phase6-publication-candidate.mjs             --remote --env staging             --candidate-out /tmp/phase6-preflight/catalog.candidate.js             --manifest-out /tmp/phase6-preflight/publication-manifest.json             --report-out /tmp/phase6-preflight/export-report.json             --require-baseline-parity
          node scripts/phase6-publication-package.mjs             --catalog /tmp/phase6-preflight/catalog.candidate.js             --manifest /tmp/phase6-preflight/publication-manifest.json             --out-dir /tmp/phase6-preflight/site             --report-out /tmp/phase6-preflight/package-plan.json             --compare-to ..             --check
          node - /tmp/phase6-preflight/package-plan.json "${{ inputs.expected_package_sha }}" <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expected = process.argv[3];
          if (
            report.ok !== true ||
            report.deterministic !== true ||
            report.packageSha256 !== expected ||
            (report.comparison?.unsafeSlugRemovals?.length ?? 1) !== 0
          ) {
            console.error("Approved publication package gate failed.", {
              expected,
              actual: report.packageSha256,
              deterministic: report.deterministic,
              unsafeSlugRemovals: report.comparison?.unsafeSlugRemovals,
            });
            process.exit(1);
          }
          console.log("Approved package SHA re-confirmed:", expected);
          NODE

      - name: Capture Production D1 bookmark and Worker deployment before-state
        shell: bash
        run: |
          mkdir -p /tmp/phase6-cutover-evidence
          npx wrangler d1 time-travel info black-sheep-commerce-prod --json             > /tmp/phase6-cutover-evidence/d1-bookmark-before.json
          npx wrangler deployments list --name black-sheep-commerce-api --json             > /tmp/phase6-cutover-evidence/worker-deployments-before.json
          npx wrangler d1 execute black-sheep-commerce-prod --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS orders FROM orders; SELECT status,COUNT(*) AS count FROM orders GROUP BY status ORDER BY status; SELECT COUNT(*) AS forbidden_tables FROM sqlite_master WHERE type='table' AND name IN ('products','product_variants','inventory_balances','inventory_movements','inventory_reservations','inventory_reservation_items');"             > /tmp/phase6-cutover-evidence/d1-before.json
          node - /tmp/phase6-cutover-evidence/d1-bookmark-before.json /tmp/phase6-cutover-evidence/d1-before.json <<'NODE'
          const fs = require("fs");
          const bookmarkPayload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const before = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const findBookmark = (value) => {
            if (!value || typeof value !== "object") return null;
            if (typeof value.bookmark === "string") return value.bookmark;
            for (const child of Object.values(value)) {
              const found = findBookmark(child);
              if (found) return found;
            }
            return null;
          };
          const bookmark = findBookmark(bookmarkPayload);
          const latest = String(before?.[0]?.results?.[0]?.name ?? "");
          const orders = Number(before?.[1]?.results?.[0]?.orders ?? -1);
          const forbidden = Number(before?.[3]?.results?.[0]?.forbidden_tables ?? -1);
          if (!bookmark || latest !== "0008_concurrency_guards.sql" || forbidden !== 0 || orders < 0) {
            console.error("Production before-state gate failed.", { bookmark, latest, orders, forbidden });
            process.exit(1);
          }
          fs.writeFileSync("/tmp/phase6-cutover-evidence/d1-bookmark.txt", bookmark + "\n");
          fs.writeFileSync("/tmp/phase6-cutover-evidence/order-count-before.txt", String(orders));
          console.log("Rollback bookmark captured:", bookmark);
          console.log("Production pre-cutover order count:", orders);
          NODE

      - name: Ensure Production Product Media R2 bucket exists
        shell: bash
        run: |
          if npx wrangler r2 bucket info "$PRODUCTION_R2_BUCKET" --json             > /tmp/phase6-cutover-evidence/r2-bucket.json 2>/tmp/phase6-cutover-evidence/r2-info-error.txt
          then
            echo "Production R2 bucket already exists."
          else
            echo "Creating Production R2 bucket: $PRODUCTION_R2_BUCKET"
            npx wrangler r2 bucket create "$PRODUCTION_R2_BUCKET"
            npx wrangler r2 bucket info "$PRODUCTION_R2_BUCKET" --json               > /tmp/phase6-cutover-evidence/r2-bucket.json
          fi

      - name: Apply Production migrations 0009 through 0012
        run: npm run db:migrate:production

      - name: Verify migrations preserved existing orders
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS orders FROM orders; SELECT COUNT(*) AS products FROM products; SELECT COUNT(*) AS variants FROM product_variants;"             > /tmp/phase6-cutover-evidence/post-migration.json
          node - /tmp/phase6-cutover-evidence/post-migration.json /tmp/phase6-cutover-evidence/order-count-before.txt <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const beforeOrders = Number(fs.readFileSync(process.argv[3], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const orders = Number(blocks?.[1]?.results?.[0]?.orders ?? -1);
          const products = Number(blocks?.[2]?.results?.[0]?.products ?? -1);
          const variants = Number(blocks?.[3]?.results?.[0]?.variants ?? -1);
          if (
            latest !== "0012_order_returns.sql" ||
            orders < beforeOrders ||
            products !== 0 ||
            variants !== 0
          ) {
            console.error("Post-migration safety gate failed.", {
              latest, beforeOrders, orders, products, variants,
            });
            process.exit(1);
          }
          console.log("Migrations complete without order loss.", { beforeOrders, orders });
          NODE

      - name: Import initial 146 Production Products
        run: npm run product-core:import:production

      - name: Verify exact Production Product Core parity
        run: |
          npm run product-core:parity:production --             --json-out /tmp/phase6-cutover-evidence/product-parity.json             --markdown /tmp/phase6-cutover-evidence/product-parity.md

      - name: Regenerate publication package from Production D1
        shell: bash
        run: |
          mkdir -p /tmp/phase6-production-publication
          node scripts/phase6-publication-candidate.mjs             --remote --env production             --candidate-out /tmp/phase6-production-publication/catalog.candidate.js             --manifest-out /tmp/phase6-production-publication/publication-manifest.json             --report-out /tmp/phase6-production-publication/export-report.json             --require-baseline-parity
          node scripts/phase6-publication-package.mjs             --catalog /tmp/phase6-production-publication/catalog.candidate.js             --manifest /tmp/phase6-production-publication/publication-manifest.json             --out-dir /tmp/phase6-production-publication/site             --report-out /tmp/phase6-production-publication/package-plan.json             --compare-to ..             --check
          node - /tmp/phase6-production-publication/package-plan.json "${{ inputs.expected_package_sha }}" <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expected = process.argv[3];
          if (
            report.ok !== true ||
            report.deterministic !== true ||
            report.files !== 162 ||
            report.packageSha256 !== expected ||
            (report.comparison?.unsafeSlugRemovals?.length ?? 1) !== 0
          ) {
            console.error("Production-generated publication package differs from approved package.", {
              expected,
              actual: report.packageSha256,
              files: report.files,
              unsafeSlugRemovals: report.comparison?.unsafeSlugRemovals,
            });
            process.exit(1);
          }
          console.log("Production D1 generated the approved publication package.");
          NODE

      - name: Apply verified cutover source locally
        shell: bash
        run: |
          node scripts/phase6-production-activate.mjs             --package-dir /tmp/phase6-production-publication/site             --package-sha "${{ inputs.expected_package_sha }}"             --r2-bucket "$PRODUCTION_R2_BUCKET"             --report-out /tmp/phase6-cutover-evidence/activation-report.json
          cat /tmp/phase6-cutover-evidence/activation-report.json

      - name: Validate exact post-cutover source
        run: npm run check

      - name: Ensure main has not advanced before source commit
        shell: bash
        working-directory: .
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced during cutover. STOP before source push/Worker authority activation."
            exit 1
          fi

      - name: Commit verified cutover source
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog.js assets/site.js sitemap.xml products             all-products.html gifts*.html icecream.html romneys.html hawkshead-relish.html             commerce/wrangler.jsonc
          git diff --cached --quiet && {
            echo "::error::No cutover source changes were staged."
            exit 1
          }
          git commit -m "release: activate Phase 6 Production D1 commerce [phase6-production-cutover]"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/phase6-cutover-evidence/cutover-source-commit.txt
          echo "Cutover source commit: $(cat /tmp/phase6-cutover-evidence/cutover-source-commit.txt)"

      - name: Deploy D1-authoritative Production Worker
        run: |
          npx wrangler deploy --message "Phase 6 Production D1 commerce cutover"             | tee /tmp/phase6-cutover-evidence/worker-deploy.txt

      - name: Verify Production runtime authority
        shell: bash
        working-directory: .
        run: |
          PASSED=0
          for attempt in $(seq 1 20); do
            HEALTH="$(curl --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/health || true)"
            echo "$HEALTH"
            if node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2] || "{}");
          if (
            health.status !== "ok" ||
            health.environment !== "production" ||
            health.database !== "bound" ||
            health.features?.orderReservations !== true ||
            health.features?.publicCatalog !== true ||
            health.features?.publicCatalogContract !== "d1-published-v1" ||
            health.features?.commerceAuthority !== true
          ) process.exit(1);
          NODE
            then
              PASSED=1
              printf '%s' "$HEALTH" > /tmp/phase6-cutover-evidence/production-health.json
              break
            fi
            sleep 3
          done
          if [ "$PASSED" != "1" ]; then
            echo "::error::Production Phase 6 health did not become ready."
            exit 1
          fi

      - name: Verify Production public catalogue and parity
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 60             "https://api.theblacksheepshop.co.uk/v1/catalog?limit=200"             > /tmp/phase6-cutover-evidence/public-catalog.json
          node - /tmp/phase6-cutover-evidence/public-catalog.json <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const products = payload.products || [];
          if (products.length !== 146 || new Set(products.map((p) => p.id)).size !== 146) {
            console.error("Production public catalogue count/identity gate failed.", {
              count: products.length,
              unique: new Set(products.map((p) => p.id)).size,
            });
            process.exit(1);
          }
          NODE
          PHASE6_PUBLIC_CATALOG_ENDPOINT=https://api.theblacksheepshop.co.uk             npm run phase6:catalog-parity

      - name: Verify Production D1 and reservation schedule
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS products FROM products WHERE publication_status='ACTIVE' AND current_published_version_id IS NOT NULL; SELECT COUNT(*) AS tracked FROM product_variants v JOIN products p ON p.id=v.product_id WHERE p.publication_status='ACTIVE' AND v.is_default=1 AND v.active=1 AND v.track_inventory=1; SELECT COUNT(*) AS orders FROM orders;"             > /tmp/phase6-cutover-evidence/d1-after.json
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/black-sheep-commerce-api/schedules"             > /tmp/phase6-cutover-evidence/schedules.json
          node - /tmp/phase6-cutover-evidence/d1-after.json /tmp/phase6-cutover-evidence/schedules.json /tmp/phase6-cutover-evidence/order-count-before.txt <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const schedules = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const beforeOrders = Number(fs.readFileSync(process.argv[4], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const products = Number(blocks?.[1]?.results?.[0]?.products ?? -1);
          const tracked = Number(blocks?.[2]?.results?.[0]?.tracked ?? -1);
          const orders = Number(blocks?.[3]?.results?.[0]?.orders ?? -1);
          const cronRows = Array.isArray(schedules?.result) ? schedules.result : [];
          const cronOk = cronRows.some((row) => row.cron === "*/30 * * * *");
          if (
            latest !== "0012_order_returns.sql" ||
            products !== 146 ||
            tracked !== 0 ||
            orders < beforeOrders ||
            !cronOk
          ) {
            console.error("Production post-cutover D1/schedule gate failed.", {
              latest, products, tracked, beforeOrders, orders, cronRows,
            });
            process.exit(1);
          }
          NODE

      - name: Wait for Production storefront source deployment
        shell: bash
        working-directory: .
        run: |
          READY=0
          CUTOVER_COMMIT="$(cat /tmp/phase6-cutover-evidence/cutover-source-commit.txt)"
          for attempt in $(seq 1 60); do
            SITE="$(curl --silent --show-error --max-time 20 "https://theblacksheepshop.co.uk/assets/site.js?cutover=$CUTOVER_COMMIT" || true)"
            if echo "$SITE" | grep -q "const BLACK_SHEEP_PRODUCTION_LIVE_COMMERCE=true;"; then
              READY=1
              break
            fi
            echo "Storefront cutover source not visible yet (attempt $attempt/60)."
            sleep 5
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Production storefront source did not deploy in time."
            exit 1
          fi

      - name: Verify Production storefront canonical/static fallback surface
        shell: bash
        working-directory: .
        run: |
          HTML="$(curl --fail --silent --show-error --max-time 30 https://theblacksheepshop.co.uk/products/hc-003-three-highland-cows-see-hear-speak-no-evil-ornament.html)"
          echo "$HTML" | grep -Fq '<link rel="canonical" href="https://theblacksheepshop.co.uk/products/hc-003-three-highland-cows-see-hear-speak-no-evil-ornament.html">'
          echo "$HTML" | grep -Fq '"@type":"Product"'
          echo "$HTML" | grep -Fq 'data-product-id="HC-003"'
          echo "Production static Product surface passed."

      - name: Record automated cutover completion
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const bookmark = fs.readFileSync("/tmp/phase6-cutover-evidence/d1-bookmark.txt", "utf8").trim();
          const sourceCommit = fs.readFileSync("/tmp/phase6-cutover-evidence/cutover-source-commit.txt", "utf8").trim();
          const report = {
            ok: true,
            automatedCutoverComplete: true,
            ownerSmokePending: true,
            rollbackBookmark: bookmark,
            sourceCommit,
            approvedPackageSha256: "${{ inputs.expected_package_sha }}",
            productionR2Bucket: process.env.PRODUCTION_R2_BUCKET,
            next: [
              "Owner Admin login and Products/Stock smoke-test",
              "One ordinary Production customer order request",
              "Confirm owner and customer Resend notifications",
              "Confirm order appears in Admin",
            ],
          };
          fs.writeFileSync(
            "/tmp/phase6-cutover-evidence/cutover-result.json",
            JSON.stringify(report, null, 2) + "\n",
          );
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-production-cutover-evidence
          path: |
            /tmp/phase6-cutover-evidence
            /tmp/phase6-production-publication/export-report.json
            /tmp/phase6-production-publication/package-plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Failure rollback guidance
        if: failure()
        shell: bash
        run: |
          echo "CUTOVER FAILED — no automatic destructive rollback is performed."
          if [ -f /tmp/phase6-cutover-evidence/d1-bookmark.txt ]; then
            BOOKMARK="$(cat /tmp/phase6-cutover-evidence/d1-bookmark.txt)"
            echo "Saved pre-cutover D1 bookmark: $BOOKMARK"
            echo "Potential restore command (ONLY if no legitimate post-bookmark writes must be preserved):"
            echo "npx wrangler d1 time-travel restore black-sheep-commerce-prod --bookmark=$BOOKMARK"
          fi
          echo "Use docs/STOREFRONT-COMMERCE-PHASE6-PRODUCTION-CUTOVER-PLAN-2026-09-26.md before any rollback."
