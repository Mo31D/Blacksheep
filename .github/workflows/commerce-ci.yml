name: Commerce CI

on:
  push:
    branches: [main, commerce-v1]
    paths:
      - "commerce/**"
      - "assets/site.js"
      - "assets/style.css"
      - "basket.html"
      - "scripts/test-commerce-legal.mjs"
      - "terms.html"
      - "delivery-returns.html"
      - "privacy.html"
      - "checkout.html"
      - "scripts/test-cart-core.mjs"
      - ".github/workflows/commerce-ci.yml"
  pull_request:
    paths:
      - "commerce/**"
      - "assets/site.js"
      - "assets/style.css"
      - "basket.html"
      - "scripts/test-cart-core.mjs"
      - ".github/workflows/commerce-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
