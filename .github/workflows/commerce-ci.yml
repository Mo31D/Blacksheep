name: Commerce CI

on:
  push:
    branches: [main]
    paths:
      - "commerce/**"
      - "assets/site.js"
      - "assets/commerce-live.js"
      - "assets/style.css"
      - "basket.html"
      - "checkout.html"
      - "order-requested.html"
      - "privacy.html"
      - "delivery-returns.html"
      - "terms.html"
      - "scripts/test-commerce-legal.mjs"
      - "scripts/test-cart-core.mjs"
      - "scripts/test-dynamic-storefront.mjs"
      - ".github/workflows/commerce-ci.yml"
  pull_request:
    paths:
      - "commerce/**"
      - "assets/site.js"
      - "assets/commerce-live.js"
      - "assets/style.css"
      - "basket.html"
      - "checkout.html"
      - "order-requested.html"
      - "privacy.html"
      - "delivery-returns.html"
      - "terms.html"
      - "scripts/test-commerce-legal.mjs"
      - "scripts/test-cart-core.mjs"
      - "scripts/test-dynamic-storefront.mjs"
      - ".github/workflows/commerce-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Install browser regression dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install regression browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify generated Admin navigation at phone widths
        run: node scripts/admin-navigation-mobile-qa.mjs
      - name: Verify archive behaviour against candidate storefront
        run: node scripts/storefront-archive-browser-qa.mjs
