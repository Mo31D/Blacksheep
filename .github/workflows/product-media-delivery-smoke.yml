name: Product Media Delivery Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/product-media-delivery-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[media-delivery-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real R2 object through Worker media route
        shell: bash
        run: |
          URL="https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/media/med_phase3_smoke_delivery"
          STATUS="$(curl --silent --show-error --location --output /tmp/media-smoke-body --write-out "%{http_code}" "$URL")"
          echo "HTTP $STATUS"
          test "$STATUS" = "200"
          test -s /tmp/media-smoke-body
          BYTES="$(wc -c < /tmp/media-smoke-body | tr -d ' ')"
          echo "Delivered bytes: $BYTES"
          test "$BYTES" -gt 0
