name: Commerce Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Worker environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      production_confirmation:
        description: "For production only, type DEPLOY-PRODUCTION"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Check Cloudflare deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Require explicit production confirmation
        if: ${{ inputs.environment == 'production' && inputs.production_confirmation != 'DEPLOY-PRODUCTION' }}
        run: |
          echo "Production deployment blocked. Re-run with production_confirmation=DEPLOY-PRODUCTION."
          exit 1
      - name: Migrate and deploy staging
        if: ${{ inputs.environment == 'staging' }}
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Migrate and deploy production
        if: ${{ inputs.environment == 'production' && inputs.production_confirmation == 'DEPLOY-PRODUCTION' }}
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
