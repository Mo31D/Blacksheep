# Phase 4 staging release — 2026-09-25 · rerunnable after 0010
name: Inventory Core Staging Phase 4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commerce/migrations/0010_inventory_core.sql"
      - "commerce/src/data/inventory.ts"
      - "commerce/src/data/products.ts"
      - "commerce/src/routes/admin.ts"
      - "commerce/src/admin/ui.ts"
      - "commerce/scripts/test-inventory-core.mjs"
      - "commerce/scripts/test-migration-upgrade.mjs"
      - "commerce/test/admin-inventory.test.ts"
      - "commerce/package.json"
      - ".github/workflows/inventory-core-staging.yml"

permissions:
  contents: read

jobs:
  deploy-inventory-core-staging:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[inventory-core-staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Run full Commerce validation
        run: npm run check

      - name: Capture staging pre-migration baseline
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging             --remote --env staging --json             --command "SELECT COUNT(*) AS products FROM products; SELECT COUNT(*) AS imported FROM product_audit_events WHERE event_type='PRODUCT_IMPORTED'; SELECT COUNT(*) AS tracked FROM product_variants WHERE track_inventory=1; SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1;"             > /tmp/inventory-pre.json
          cat /tmp/inventory-pre.json
          node - /tmp/inventory-pre.json /tmp/inventory-pre-baseline.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const baseline = {
            products: Number(blocks?.[0]?.results?.[0]?.products ?? -1),
            imported: Number(blocks?.[1]?.results?.[0]?.imported ?? -1),
            tracked: Number(blocks?.[2]?.results?.[0]?.tracked ?? -1),
            latestMigration: String(blocks?.[3]?.results?.[0]?.name ?? ""),
          };
          if (baseline.products < 146 || baseline.imported !== 146) {
            console.error("Product Core baseline is incomplete.", baseline);
            process.exit(1);
          }
          if (!["0009_product_inventory_foundation.sql", "0010_inventory_core.sql"].includes(baseline.latestMigration)) {
            console.error("Unexpected staging migration baseline.", baseline);
            process.exit(1);
          }
          fs.writeFileSync(process.argv[3], JSON.stringify(baseline));
          console.log("Pre-migration baseline captured.", baseline);
          NODE

      - name: Apply Inventory Core migration to staging only
        run: npm run db:migrate:staging

      - name: Verify Inventory Core migration preserved stock truth
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging             --remote --env staging --json             --command "SELECT COUNT(*) AS products FROM products; SELECT COUNT(*) AS imported FROM product_audit_events WHERE event_type='PRODUCT_IMPORTED'; SELECT COUNT(*) AS tracked FROM product_variants WHERE track_inventory=1; SELECT COUNT(*) AS balances FROM inventory_balances; SELECT COUNT(*) AS movements FROM inventory_movements; SELECT COUNT(*) AS incoming FROM inventory_incoming; SELECT COUNT(*) AS tracked_without_balance FROM product_variants v WHERE v.track_inventory=1 AND NOT EXISTS (SELECT 1 FROM inventory_balances b WHERE b.variant_id=v.id); SELECT COUNT(*) AS invalid_balance FROM inventory_balances WHERE on_hand<0 OR reserved<0 OR safety_stock<0 OR reserved>on_hand; SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('inventory_movements_immutable_update','inventory_movements_immutable_delete') ORDER BY name; SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_inventory_movements_idempotency','idx_inventory_movements_initial_count') ORDER BY name;"             > /tmp/inventory-post.json
          cat /tmp/inventory-post.json
          node - /tmp/inventory-pre-baseline.json /tmp/inventory-post.json <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const blocks = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const scalar = (i, key) => Number(blocks?.[i]?.results?.[0]?.[key] ?? -1);
          const after = {
            products: scalar(0, "products"),
            imported: scalar(1, "imported"),
            tracked: scalar(2, "tracked"),
            balances: scalar(3, "balances"),
            movements: scalar(4, "movements"),
            incoming: scalar(5, "incoming"),
            trackedWithoutBalance: scalar(6, "tracked_without_balance"),
            invalidBalance: scalar(7, "invalid_balance"),
            latestMigration: String(blocks?.[8]?.results?.[0]?.name ?? ""),
            triggers: (blocks?.[9]?.results || []).map(x => x.name),
            indexes: (blocks?.[10]?.results || []).map(x => x.name),
          };
          const failures = [];
          if (after.products !== before.products) failures.push("product count changed");
          if (after.imported !== 146) failures.push("import baseline changed");
          if (after.tracked !== before.tracked) failures.push("migration changed tracking state");
          if (
            before.latestMigration === "0009_product_inventory_foundation.sql" &&
            before.tracked === 0 &&
            (after.balances !== 0 || after.movements !== 0 || after.incoming !== 0)
          ) {
            failures.push("first 0010 migration invented inventory rows");
          }
          if (after.trackedWithoutBalance !== 0) failures.push("tracked variant lacks balance");
          if (after.invalidBalance !== 0) failures.push("invalid balance");
          if (after.latestMigration !== "0010_inventory_core.sql") failures.push("0010 not latest migration");
          for (const required of ["inventory_movements_immutable_update","inventory_movements_immutable_delete"]) {
            if (!after.triggers.includes(required)) failures.push("missing trigger " + required);
          }
          for (const required of ["idx_inventory_movements_idempotency","idx_inventory_movements_initial_count"]) {
            if (!after.indexes.includes(required)) failures.push("missing index " + required);
          }
          if (failures.length) {
            console.error("Inventory migration safety gate failed:", failures, { before, after });
            process.exit(1);
          }
          console.log("Inventory migration safety gate passed.", { before, after });
          NODE

      - name: Verify Production remains pre-Product-Core
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod             --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS forbidden_tables FROM sqlite_master WHERE type='table' AND name IN ('products','inventory_balances','inventory_movements','inventory_incoming'); SELECT COUNT(*) AS orders FROM orders;"             > /tmp/production-safety.json
          cat /tmp/production-safety.json
          node - /tmp/production-safety.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const forbidden = Number(blocks?.[1]?.results?.[0]?.forbidden_tables ?? -1);
          const orders = Number(blocks?.[2]?.results?.[0]?.orders ?? -1);
          if (latest !== "0008_concurrency_guards.sql" || forbidden !== 0) {
            console.error("Production isolation gate failed.", { latest, forbidden, orders });
            process.exit(1);
          }
          console.log("Production remains isolated.", { latest, orders });
          NODE

      - name: Deploy Inventory Core Admin to staging only
        run: npx wrangler deploy --env staging

      - name: Verify staging Worker health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const failures = [];
          if (health.status !== "ok") failures.push("status");
          if (health.environment !== "staging") failures.push("environment");
          if (health.database !== "bound") failures.push("database");
          if (failures.length) {
            console.error("Staging health gate failed:", failures.join(", "));
            process.exit(1);
          }
          console.log("Staging health gate passed.");
          NODE

      - name: Verify staging Admin shell
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30             https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/admin             > /tmp/admin.html
          test -s /tmp/admin.html
          grep -qi "Black Sheep" /tmp/admin.html
          grep -qi "Admin sign in" /tmp/admin.html
          echo "Staging Admin sign-in shell is reachable."

      - name: Safety statement
        if: always()
        run: |
          echo "Phase 4 target: staging only."
          echo "No Production D1 migration or Worker deploy is run."
          echo "Migration 0010 never invents stock quantities."
          echo "No Phase 5 order reservations are enabled."
          echo "No Phase 6 storefront/checkout inventory cutover is performed."
