name: Search readiness
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify-search-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-search-readiness.mjs
      - run: node scripts/build-icecream.mjs --check
      - run: node scripts/build-romneys.mjs --check
