name: Final cross-builder QA
on:
  push:
    branches: [romneys-rebuild-2026-09-24]
    paths:
      - scripts/build-romneys.mjs
      - .github/workflows/final-cross-builder-qa.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: romneys-rebuild-2026-09-24
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-romneys.mjs
      - run: |
          node scripts/verify-search-readiness.mjs
          node scripts/build-icecream.mjs --check
          node scripts/build-romneys.mjs --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-romneys.mjs all-products.html romneys.html sitemap.xml products/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "romneys: reconcile cross-builder output"
            git push origin HEAD:romneys-rebuild-2026-09-24
          fi
