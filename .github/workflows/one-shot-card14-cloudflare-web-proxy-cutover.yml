name: One-shot CARD 14 Cloudflare Web Proxy Cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-card14-cloudflare-web-proxy-cutover.yml"

permissions:
  contents: read

concurrency:
  group: black-sheep-production-dns-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare credential
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Proxy web DNS through Cloudflare with automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail

          api() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }

          ZONE_JSON="$(api "https://api.cloudflare.com/client/v4/zones?name=theblacksheepshop.co.uk")"
          ZONE_ID="$(printf '%s' "$ZONE_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const z=j.result?.[0];if(!z||z.status!=="active"||z.paused) process.exit(2);process.stdout.write(z.id)})')"
          test -n "$ZONE_ID" || { echo "::error::Active Cloudflare zone not found"; exit 1; }

          SSL_MODE="$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j.result?.value||""))})')"
          case "$SSL_MODE" in
            flexible|full|strict) echo "Cloudflare SSL mode: $SSL_MODE" ;;
            *) echo "::error::Unsafe/unknown Cloudflare SSL mode: $SSL_MODE"; exit 1 ;;
          esac

          DNS_JSON="$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")"
          printf '%s' "$DNS_JSON" > /tmp/dns-before.json

          mapfile -t RECORD_IDS < <(printf '%s' "$DNS_JSON" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const rows=(j.result||[]).filter(r =>
                r.proxiable === true &&
                r.proxied === false &&
                ["A","AAAA","CNAME"].includes(r.type) &&
                ["theblacksheepshop.co.uk","www.theblacksheepshop.co.uk"].includes(r.name)
              );
              for(const r of rows) console.log(r.id);
            });
          ')

          if [ "${#RECORD_IDS[@]}" -ne 5 ]; then
            echo "::error::Expected exactly 5 DNS-only web records (4 apex A + 1 www CNAME), found ${#RECORD_IDS[@]}"
            exit 1
          fi

          rollback() {
            code=$?
            echo "::warning::Cutover verification failed; restoring web DNS to DNS-only."
            for id in "${RECORD_IDS[@]}"; do
              api -X PATCH \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" \
                --data '{"proxied":false}' >/dev/null || true
            done
            exit "$code"
          }
          trap rollback ERR

          for id in "${RECORD_IDS[@]}"; do
            api -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" \
              --data '{"proxied":true}' >/dev/null
          done

          DNS_AFTER="$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")"
          printf '%s' "$DNS_AFTER" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const rows=(j.result||[]).filter(r =>
                ["A","AAAA","CNAME"].includes(r.type) &&
                ["theblacksheepshop.co.uk","www.theblacksheepshop.co.uk"].includes(r.name)
              );
              if(rows.length!==5 || rows.some(r=>r.proxied!==true)) {
                console.error("Not all web DNS records are proxied");
                process.exit(1);
              }
              console.log("All 5 web DNS records are now proxied.");
            });
          '

          # Retry live checks while Cloudflare edge state converges.
          ok=0
          for attempt in $(seq 1 12); do
            home_status="$(curl --silent --output /tmp/home.html --write-out '%{http_code}' --max-time 20 https://theblacksheepshop.co.uk/ || true)"
            coll_headers="$(curl --silent --head --max-time 20 https://theblacksheepshop.co.uk/collections/gifts || true)"
            coll_status="$(printf '%s' "$coll_headers" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')"
            coll_location="$(printf '%s' "$coll_headers" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -1)"
            dynamic_status="$(curl --silent --output /tmp/dynamic.html --write-out '%{http_code}' --max-time 20 https://theblacksheepshop.co.uk/collections/chutneys-pickles || true)"
            sitemap_status="$(curl --silent --output /tmp/sitemap.xml --write-out '%{http_code}' --max-time 20 https://theblacksheepshop.co.uk/sitemap.xml || true)"
            echo "attempt=$attempt home=$home_status gifts=$coll_status gifts_location=$coll_location dynamic=$dynamic_status sitemap=$sitemap_status"
            echo "home_server=$(curl --silent --head --max-time 20 https://theblacksheepshop.co.uk/ | tr -d '\\r' | awk 'tolower($1)=="server:" {print $2}' | tail -1 || true)"
            echo "gifts_server=$(printf '%s' "$coll_headers" | tr -d '\\r' | awk 'tolower($1)=="server:" {print $2}' | tail -1 || true)"

            if [ "$home_status" = "200" ] &&
               grep -qi "The Black Sheep" /tmp/home.html &&
               [ "$coll_status" = "301" ] &&
               printf '%s' "$coll_location" | grep -q '/gifts.html' &&
               [ "$dynamic_status" = "200" ] &&
               grep -Fq 'rel="canonical" href="https://theblacksheepshop.co.uk/collections/chutneys-pickles"' /tmp/dynamic.html &&
               [ "$sitemap_status" = "200" ] &&
               grep -Fq '<loc>https://theblacksheepshop.co.uk/collections/chutneys-pickles</loc>' /tmp/sitemap.xml &&
               ! grep -Fq '<loc>https://theblacksheepshop.co.uk/collections/gifts</loc>' /tmp/sitemap.xml; then
              ok=1
              break
            fi
            sleep 5
          done

          test "$ok" = "1"

          legacy_product_status="$(curl --silent --output /tmp/legacy-product.html --write-out '%{http_code}' --max-time 20 https://theblacksheepshop.co.uk/products/pr-047-peter-rabbit-medium.html)"
          test "$legacy_product_status" = "200"
          grep -qi "Peter Rabbit" /tmp/legacy-product.html

          api_health="$(curl --fail --silent --show-error --max-time 20 https://api.theblacksheepshop.co.uk/health)"
          printf '%s' "$api_health" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const h=JSON.parse(s);
              if(h.status!=="ok" || h.environment!=="production" || h.database!=="bound") process.exit(1);
              if(h.features?.cleanCollectionRoutes!==true) process.exit(1);
              if(h.features?.cleanProductRoutes!==false) process.exit(1);
              console.log("Production API health and guarded flags verified.");
            });
          '

          server_header="$(curl --silent --head --max-time 20 https://theblacksheepshop.co.uk/ | tr -d '\r' | awk 'tolower($1)=="server:" {print tolower($2)}' | tail -1)"
          test "$server_header" = "cloudflare"

          trap - ERR
          echo "CARD 14 Cloudflare web proxy cutover verified."
          echo "Homepage remains available, clean Collections route through Worker, dynamic sitemap is live, and legacy Product pages remain untouched."
