name: Commerce Staging V2 Deploy
# Trigger guarded staging acceptance for direct Section Image Library selection; never deploy production.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-staging-v2-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Actions credentials are unavailable."
            exit 1
          fi

      - name: Full pre-deploy validation
        run: npm run check

      - name: Record staging migrations before deploy
        run: npm run db:migrations:list:staging

      - name: Apply staging migrations only
        run: npm run db:migrate:staging

      - name: Confirm staging migrations after apply
        run: npm run db:migrations:list:staging

      - name: Deploy staging Worker only
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --env staging 2>&1 | tee /tmp/staging-deploy.log
          STAGING_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/staging-deploy.log | tail -1 || true)"
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          if [ -n "$STAGING_URL" ]; then
            echo "Staging URL detected: $STAGING_URL"
          else
            echo "::warning::Staging workers.dev URL was not detected in Wrangler output."
          fi
          if grep -Eq 'api\.theblacksheepshop\.co\.uk|admin\.theblacksheepshop\.co\.uk' /tmp/staging-deploy.log; then
            echo "::error::Staging deploy output referenced a Production custom domain."
            exit 1
          fi
          echo "Staging custom-domain isolation verified."

      - name: Record deployed staging Worker state
        run: |
          npx wrangler deployments status --env staging --json
          npx wrangler deployments list --env staging --json

      - name: Verify staging health
        if: steps.deploy.outputs.url != ''
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/health" | tee /tmp/staging-health.json
          echo
          node - <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync("/tmp/staging-health.json", "utf8"));
          if (health.status !== "ok") throw new Error("staging health status is not ok");
          if (health.environment !== "staging") throw new Error("staging environment marker is incorrect");
          if (health.database !== "bound") throw new Error("staging D1 binding is not active");
          console.log("Staging health verified.");
          NODE

      - name: Verify published Storefront hierarchy and clean routes
        if: steps.deploy.outputs.url != ''
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/v1/storefront-structure" -o /tmp/staging-structure.json
          # Clean pages allow stale cache responses; use a unique query after this deployment.
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/collections/local-treats?acceptance=$GITHUB_SHA" -o /tmp/staging-local-treats.html
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/collections/mint-cake?acceptance=$GITHUB_SHA" -o /tmp/staging-mint-cake.html
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/sitemap.xml" -o /tmp/staging-sitemap.xml
          curl --silent --show-error --max-time 20 -D /tmp/staging-romneys-headers -o /dev/null "$STAGING_URL/collections/romneys"
          node - <<'NODE'
          const fs = require("fs");
          const nodes = JSON.parse(fs.readFileSync("/tmp/staging-structure.json", "utf8")).nodes;
          const roots = nodes.filter((n) => !n.parentNodeId && n.showInNavigation).sort((a,b) => a.sortOrder-b.sortOrder);
          const expected = ["Local Treats","Lake District Souvenirs","Peter Rabbit Gifts","Highland Cows Ornaments","Ice cream","Christmas"];
          if (JSON.stringify(roots.map((n) => n.name)) !== JSON.stringify(expected)) throw new Error("Published roots differ from owner target");
          const local = nodes.find((n) => n.stableKey === "local-treats");
          const romneys = nodes.find((n) => n.id === "sfn_romneys");
          const hawkshead = nodes.find((n) => n.id === "sfn_hawkshead");
          if (!local || romneys?.parentNodeId !== local.id || hawkshead?.parentNodeId !== local.id) throw new Error("Local Treats parents incorrect");
          for (const parent of [romneys, hawkshead]) {
            if (nodes.filter((n) => n.parentNodeId === parent.id).length < 5) throw new Error(parent.name + " lost child sections");
          }
          const localHtml = fs.readFileSync("/tmp/staging-local-treats.html", "utf8");
          const mintHtml = fs.readFileSync("/tmp/staging-mint-cake.html", "utf8");
          const menu = localHtml.match(/<nav class="menu">([\s\S]*?)<\/nav>/)?.[1] || "";
          if ((menu.match(/<a /g) || []).length !== 6 || !expected.every((name) => menu.includes(name))) throw new Error("Server HTML lacks six-root navigation: " + menu.slice(0, 1200));
          if (menu.includes("Romney&#39;s") || menu.includes("Hawkshead Relish")) throw new Error("Nested sections leaked into main menu");
          const productCount = Number(localHtml.match(/<span class="catalog-count">(\d+) products<\/span>/)?.[1] || 0);
          if (productCount < 1 || !localHtml.includes("Romney&#39;s") || !localHtml.includes("Hawkshead Relish")) throw new Error("Local Treats collection missing products or child links");
          if (!mintHtml.includes("Local Treats") || !mintHtml.includes("Romney&#39;s")) throw new Error("Third-level breadcrumb missing");
          const sitemap = fs.readFileSync("/tmp/staging-sitemap.xml", "utf8");
          for (const path of ["/collections/local-treats","/collections/mint-cake","/romneys.html","/hawkshead-relish.html"]) {
            if (!sitemap.includes(path)) throw new Error("Sitemap missing " + path);
          }
          const redirect = fs.readFileSync("/tmp/staging-romneys-headers", "utf8");
          if (!/^HTTP\/\S+ 301/m.test(redirect) || !redirect.includes("/romneys.html")) throw new Error("Legacy Romney's route no longer redirects");
          console.log("Staging six-root menu, third level, " + productCount + " Products, legacy redirect and sitemap verified.");
          NODE

      - name: Safety confirmation
        run: |
          echo "Staging-only deployment completed."
          echo "Production Worker and production D1 were not modified by this workflow."

