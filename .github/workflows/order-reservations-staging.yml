name: Order Reservations Staging Phase 5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commerce/migrations/0011_order_reservations.sql"
      - "commerce/migrations/0012_order_returns.sql"
      - "commerce/scripts/test-migration-upgrade.mjs"
      - "commerce/scripts/test-order-reservations.mjs"
      - "commerce/src/data/order-reservations.ts"
      - "commerce/src/data/order-revisions.ts"
      - "commerce/src/data/customer-review.ts"
      - "commerce/src/data/admin-orders.ts"
      - "commerce/src/routes/admin.ts"
      - "commerce/src/routes/customer-review.ts"
      - "commerce/src/index.ts"
      - "commerce/test/order-reservations.test.ts"
      - "commerce/test/order-reservation-transitions.test.ts"
      - "commerce/test/order-reservation-expiry.test.ts"
      - "commerce/test/customer-review-reservations.test.ts"
      - "commerce/test/customer-review-expiry.test.ts"
      - "commerce/test/admin-order-reservations.test.ts"
      - "commerce/test/admin-revision-routes.test.ts"
      - "commerce/test/order-return-to-stock.test.ts"
      - "commerce/test/admin-routes.test.ts"
      - "commerce/test/health.test.ts"
      - "commerce/wrangler.jsonc"
      - "commerce/package.json"
      - ".github/workflows/order-reservations-staging.yml"

permissions:
  contents: read

jobs:
  reservation-foundation-staging:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[order-reservations-staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify reservation feature is staging-only in source config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const production = config.vars || {};
          const staging = config.env?.staging?.vars || {};
          if (production.ORDER_RESERVATIONS_ENABLED === "true") {
            console.error("Production reservation feature must remain disabled.", production);
            process.exit(1);
          }
          if (staging.ORDER_RESERVATIONS_ENABLED !== "true") {
            console.error("Staging reservation feature must be explicitly enabled.", staging);
            process.exit(1);
          }
          console.log("Feature configuration gate passed: staging enabled, Production disabled.");
          NODE

      - name: Run full Commerce validation
        run: npm run check

      - name: Capture staging Phase 5 runtime baseline
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging \
            --remote --env staging --json \
            --command "SELECT COUNT(*) AS products FROM products; SELECT COUNT(*) AS imported FROM product_audit_events WHERE event_type='PRODUCT_IMPORTED'; SELECT COUNT(*) AS tracked FROM product_variants WHERE track_inventory=1; SELECT COUNT(*) AS balances FROM inventory_balances; SELECT COUNT(*) AS movements FROM inventory_movements; SELECT COUNT(*) AS incoming FROM inventory_incoming; SELECT COUNT(*) AS reservations FROM inventory_reservations; SELECT COUNT(*) AS reservation_items FROM inventory_reservation_items; SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1;" \
            > /tmp/reservation-pre.json
          cat /tmp/reservation-pre.json
          node - /tmp/reservation-pre.json /tmp/reservation-pre-baseline.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const scalar = (i, key) => Number(blocks?.[i]?.results?.[0]?.[key] ?? -1);
          const baseline = {
            products: scalar(0, "products"),
            imported: scalar(1, "imported"),
            tracked: scalar(2, "tracked"),
            balances: scalar(3, "balances"),
            movements: scalar(4, "movements"),
            incoming: scalar(5, "incoming"),
            reservations: scalar(6, "reservations"),
            reservationItems: scalar(7, "reservation_items"),
            latestMigration: String(blocks?.[8]?.results?.[0]?.name ?? ""),
          };
          if (baseline.products < 146 || baseline.imported !== 146) {
            console.error("Product Core baseline is incomplete.", baseline);
            process.exit(1);
          }
          if (!["0011_order_reservations.sql", "0012_order_returns.sql"].includes(baseline.latestMigration)) {
            console.error("Unexpected Phase 5 staging migration baseline.", baseline);
            process.exit(1);
          }
          fs.writeFileSync(process.argv[3], JSON.stringify(baseline));
          console.log("Phase 5 runtime baseline captured.", baseline);
          NODE

      - name: Apply Phase 5 migrations to staging only
        run: npm run db:migrate:staging

      - name: Verify Phase 5 migrations are side-effect free
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging \
            --remote --env staging --json \
            --command "SELECT COUNT(*) AS products FROM products; SELECT COUNT(*) AS imported FROM product_audit_events WHERE event_type='PRODUCT_IMPORTED'; SELECT COUNT(*) AS tracked FROM product_variants WHERE track_inventory=1; SELECT COUNT(*) AS balances FROM inventory_balances; SELECT COUNT(*) AS movements FROM inventory_movements; SELECT COUNT(*) AS incoming FROM inventory_incoming; SELECT COUNT(*) AS reservations FROM inventory_reservations; SELECT COUNT(*) AS reservation_items FROM inventory_reservation_items; SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_inventory_reservations_idempotency','idx_inventory_reservations_state_expiry','idx_inventory_reservations_location_state','idx_inventory_reservation_items_reservation','idx_inventory_reservation_items_variant','idx_inventory_reservations_returned') ORDER BY name; SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('inventory_reservation_items_immutable_update','inventory_reservation_items_immutable_delete') ORDER BY name; SELECT returned_at FROM inventory_reservations LIMIT 0;" \
            > /tmp/reservation-post.json
          cat /tmp/reservation-post.json
          node - /tmp/reservation-pre-baseline.json /tmp/reservation-post.json <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const blocks = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const scalar = (i, key) => Number(blocks?.[i]?.results?.[0]?.[key] ?? -1);
          const after = {
            products: scalar(0, "products"),
            imported: scalar(1, "imported"),
            tracked: scalar(2, "tracked"),
            balances: scalar(3, "balances"),
            movements: scalar(4, "movements"),
            incoming: scalar(5, "incoming"),
            reservations: scalar(6, "reservations"),
            reservationItems: scalar(7, "reservation_items"),
            latestMigration: String(blocks?.[8]?.results?.[0]?.name ?? ""),
            indexes: (blocks?.[9]?.results || []).map(x => x.name),
            triggers: (blocks?.[10]?.results || []).map(x => x.name),
          };
          const failures = [];
          for (const key of ["products","imported","tracked","balances","movements","incoming","reservations","reservationItems"]) {
            if (after[key] !== before[key]) failures.push(key + " changed during idempotent migration check");
          }
          if (after.latestMigration !== "0012_order_returns.sql") failures.push("0012 not latest migration");
          for (const required of [
            "idx_inventory_reservations_idempotency",
            "idx_inventory_reservations_state_expiry",
            "idx_inventory_reservations_location_state",
            "idx_inventory_reservation_items_reservation",
            "idx_inventory_reservation_items_variant",
            "idx_inventory_reservations_returned",
          ]) {
            if (!after.indexes.includes(required)) failures.push("missing index " + required);
          }
          for (const required of [
            "inventory_reservation_items_immutable_update",
            "inventory_reservation_items_immutable_delete",
          ]) {
            if (!after.triggers.includes(required)) failures.push("missing trigger " + required);
          }
          if (failures.length) {
            console.error("Reservation Foundation staging gate failed.", { failures, before, after });
            process.exit(1);
          }
          console.log("Phase 5 staging schema gate passed.", { before, after });
          NODE

      - name: Verify Production remains pre-Product-Core
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod \
            --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS forbidden_tables FROM sqlite_master WHERE type='table' AND name IN ('products','inventory_balances','inventory_movements','inventory_incoming','inventory_reservations','inventory_reservation_items'); SELECT COUNT(*) AS orders FROM orders;" \
            > /tmp/production-safety.json
          cat /tmp/production-safety.json
          node - /tmp/production-safety.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const forbidden = Number(blocks?.[1]?.results?.[0]?.forbidden_tables ?? -1);
          const orders = Number(blocks?.[2]?.results?.[0]?.orders ?? -1);
          if (latest !== "0008_concurrency_guards.sql" || forbidden !== 0) {
            console.error("Production isolation gate failed.", { latest, forbidden, orders });
            process.exit(1);
          }
          console.log("Production remains isolated.", { latest, orders });
          NODE

      - name: Deploy reservation-aware Worker to staging only
        run: npx wrangler deploy --env staging

      - name: Verify staging Worker reservation mode and health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          if (
            health.status !== "ok" ||
            health.environment !== "staging" ||
            health.database !== "bound" ||
            health.features?.orderReservations !== true
          ) {
            console.error("Staging reservation runtime gate failed.", health);
            process.exit(1);
          }
          console.log("Staging reservation runtime gate passed.");
          NODE

      - name: Safety statement
        if: always()
        run: |
          echo "Phase 5 runtime target: staging only."
          echo "ORDER_RESERVATIONS_ENABLED=true exists only under env.staging vars."
          echo "No Production migration or Worker deploy is run."
          echo "Staging schema target is 0012_order_returns.sql."
          echo "Production remains pre-Product-Core at migration 0008."
          echo "No Phase 6 storefront/checkout inventory cutover is performed."
