name: Phase 6 Production Cutover Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase6-production-cutover-readiness.yml"
      - ".github/workflows/phase6-production-cutover.yml"
      - ".github/workflows/commerce-deploy.yml"
      - "docs/STOREFRONT-COMMERCE-PHASE6-PRODUCTION-CUTOVER-PLAN-2026-09-26.md"
      - "commerce/scripts/phase6-publication-candidate.mjs"
      - "commerce/scripts/phase6-publication-render.mjs"
      - "commerce/scripts/phase6-publication-collections.mjs"
      - "commerce/scripts/phase6-publication-verify.mjs"
      - "commerce/scripts/phase6-publication-package.mjs"
      - "commerce/scripts/phase6-production-activate.mjs"
      - "commerce/scripts/product-core-import.mjs"
      - "commerce/scripts/product-core-parity.mjs"
      - "commerce/scripts/test-product-core-production-guards.mjs"
      - "commerce/fixtures/product-core-baseline.catalog.js"
      - "commerce/package.json"
      - "assets/site.js"
      - "commerce/wrangler.jsonc"

permissions:
  contents: read

jobs:
  readiness:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[phase6-production-cutover]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare read credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify Production source config remains pre-cutover
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const vars = config.vars || {};
          const r2 = config.r2_buckets || [];
          const site = fs.readFileSync("../assets/site.js", "utf8");
          const failures = [];
          if (vars.D1_PUBLIC_CATALOG_ENABLED === "true") failures.push("D1_PUBLIC_CATALOG_ENABLED");
          if (vars.D1_COMMERCE_AUTHORITY_ENABLED === "true") failures.push("D1_COMMERCE_AUTHORITY_ENABLED");
          if (vars.ORDER_RESERVATIONS_ENABLED === "true") failures.push("ORDER_RESERVATIONS_ENABLED");
          if (r2.some((binding) => binding.binding === "PRODUCT_MEDIA")) failures.push("PRODUCT_MEDIA");
          if (!site.includes("const BLACK_SHEEP_PRODUCTION_LIVE_COMMERCE=false;")) {
            failures.push("BLACK_SHEEP_PRODUCTION_LIVE_COMMERCE");
          }
          if (failures.length) {
            console.error("Production source config is no longer pre-cutover.", failures);
            process.exit(1);
          }
          console.log("Production source config remains pre-cutover.");
          NODE

      - name: Verify Production cutover workflow remains manual and guarded
        shell: bash
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const cutover = fs.readFileSync(".github/workflows/phase6-production-cutover.yml", "utf8");
          const legacy = fs.readFileSync(".github/workflows/commerce-deploy.yml", "utf8");
          const failures = [];
          if (!cutover.includes("workflow_dispatch:")) failures.push("cutover workflow is not workflow_dispatch");
          if (/\n\s{2}push:/.test(cutover)) failures.push("cutover workflow has a push trigger");
          if (!cutover.includes("CUTOVER-PRODUCTION-D1")) failures.push("cutover confirmation literal missing");
          if (!cutover.includes("expected_package_sha")) failures.push("approved package SHA input missing");
          if (!cutover.includes("environment: production")) failures.push("GitHub production environment gate missing");
          if (!cutover.includes("contents: write")) failures.push("cutover contents write permission missing");
          if (!cutover.includes("d1 time-travel info black-sheep-commerce-prod")) failures.push("Time Travel bookmark capture missing");
          if (!cutover.includes("product-core:import:production")) failures.push("guarded Production import missing");
          if (!cutover.includes("product-core:parity:production")) failures.push("Production parity gate missing");
          if (!cutover.includes("phase6-production-activate.mjs")) failures.push("activation step missing");
          if (!cutover.includes("ownerSmokePending: true")) failures.push("post-cutover owner smoke gate missing");
          if (!legacy.includes("Production deploy is intentionally blocked here.")) {
            failures.push("legacy Production deploy is not blocked");
          }
          if (failures.length) {
            console.error("Production cutover workflow guard failed.", failures);
            process.exit(1);
          }
          console.log("Production cutover workflow remains manual-only and guarded.");
          NODE

      - name: Capture Production before-state
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod             --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS orders FROM orders; SELECT COUNT(*) AS forbidden_tables FROM sqlite_master WHERE type='table' AND name IN ('products','product_variants','inventory_balances','inventory_movements','inventory_reservations','inventory_reservation_items'); SELECT status,COUNT(*) AS count FROM orders GROUP BY status ORDER BY status;"             > /tmp/phase6-prod-before.json
          cat /tmp/phase6-prod-before.json
          node - /tmp/phase6-prod-before.json /tmp/phase6-prod-order-count <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const orders = Number(blocks?.[1]?.results?.[0]?.orders ?? -1);
          const forbidden = Number(blocks?.[2]?.results?.[0]?.forbidden_tables ?? -1);
          if (latest !== "0008_concurrency_guards.sql" || forbidden !== 0 || orders < 0) {
            console.error("Unexpected Production pre-cutover state.", { latest, orders, forbidden });
            process.exit(1);
          }
          fs.writeFileSync(process.argv[3], String(orders));
          console.log("Production pre-cutover gate passed.", { latest, orders, forbidden });
          NODE

      - name: Record pending Production migrations without applying them
        shell: bash
        run: |
          npm run db:migrations:list:production 2>&1 | tee /tmp/phase6-prod-migrations.txt
          for migration in             0009_product_inventory_foundation.sql             0010_inventory_core.sql             0011_order_reservations.sql             0012_order_returns.sql
          do
            grep -q "$migration" /tmp/phase6-prod-migrations.txt || {
              echo "::error::Expected pending migration not listed: $migration"
              exit 1
            }
          done
          echo "All Phase 6 Production migrations remain pending; none were applied."

      - name: Confirm staging Product/Inventory truth baseline
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging             --remote --env staging --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS active FROM products WHERE publication_status='ACTIVE' AND current_published_version_id IS NOT NULL; SELECT COUNT(*) AS tracked FROM product_variants v JOIN products p ON p.id=v.product_id WHERE p.publication_status='ACTIVE' AND v.is_default=1 AND v.active=1 AND v.track_inventory=1; SELECT COUNT(*) AS active_r2_media FROM product_media pm JOIN products p ON p.id=pm.product_id JOIN product_version_media pvm ON pvm.media_id=pm.id AND pvm.product_version_id=p.current_published_version_id WHERE p.publication_status='ACTIVE' AND pm.deleted_at IS NULL AND pm.storage_provider='R2';"             > /tmp/phase6-staging-truth.json
          cat /tmp/phase6-staging-truth.json
          node - /tmp/phase6-staging-truth.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const active = Number(blocks?.[1]?.results?.[0]?.active ?? -1);
          const tracked = Number(blocks?.[2]?.results?.[0]?.tracked ?? -1);
          const activeR2Media = Number(blocks?.[3]?.results?.[0]?.active_r2_media ?? -1);
          if (latest !== "0012_order_returns.sql" || active !== 146 || tracked !== 0 || activeR2Media < 0) {
            console.error("Unexpected staging cutover baseline.", { latest, active, tracked, activeR2Media });
            process.exit(1);
          }
          fs.writeFileSync(
            "/tmp/phase6-staging-truth-summary.json",
            JSON.stringify({ latest, active, tracked, activeR2Media }, null, 2),
          );
          NODE

      - name: Export and verify current publication package read-only
        shell: bash
        run: |
          mkdir -p /tmp/phase6-cutover
          node scripts/phase6-publication-candidate.mjs             --remote --env staging             --candidate-out /tmp/phase6-cutover/catalog.candidate.js             --manifest-out /tmp/phase6-cutover/publication-manifest.json             --report-out /tmp/phase6-cutover/export-report.json             --require-baseline-parity
          node scripts/phase6-publication-package.mjs             --catalog /tmp/phase6-cutover/catalog.candidate.js             --manifest /tmp/phase6-cutover/publication-manifest.json             --out-dir /tmp/phase6-cutover/site             --report-out /tmp/phase6-cutover/package-plan.json             --compare-to ..             --check
          cat /tmp/phase6-cutover/export-report.json
          cat /tmp/phase6-cutover/package-plan.json

      - name: Simulate exact post-cutover source locally
        shell: bash
        run: |
          PACKAGE_SHA="$(node -e "const r=require('/tmp/phase6-cutover/package-plan.json');process.stdout.write(r.packageSha256)")"
          node scripts/phase6-production-activate.mjs             --package-dir /tmp/phase6-cutover/site             --package-sha "$PACKAGE_SHA"             --r2-bucket black-sheep-product-media-prod             --report-out /tmp/phase6-cutover/activation-report.json
          cat /tmp/phase6-cutover/activation-report.json
          node - /tmp/phase6-cutover/activation-report.json <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            report.ok !== true ||
            report.dryRun !== false ||
            report.publicationFiles !== 162 ||
            report.productionLiveCommerce !== true ||
            report.productionFlags?.D1_PUBLIC_CATALOG_ENABLED !== "true" ||
            report.productionFlags?.D1_COMMERCE_AUTHORITY_ENABLED !== "true" ||
            report.productionFlags?.ORDER_RESERVATIONS_ENABLED !== "true"
          ) {
            console.error("Post-cutover source simulation failed.", report);
            process.exit(1);
          }
          NODE

      - name: Validate simulated post-cutover source
        run: npm run check

      - name: Dry-run simulated post-cutover Production Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/phase6-production-worker-dry-run

      - name: Capture Production after-state and prove read-only execution
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod             --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS orders FROM orders; SELECT COUNT(*) AS forbidden_tables FROM sqlite_master WHERE type='table' AND name IN ('products','product_variants','inventory_balances','inventory_movements','inventory_reservations','inventory_reservation_items');"             > /tmp/phase6-prod-after.json
          cat /tmp/phase6-prod-after.json
          node - /tmp/phase6-prod-after.json /tmp/phase6-prod-order-count <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const beforeOrders = Number(fs.readFileSync(process.argv[3], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const orders = Number(blocks?.[1]?.results?.[0]?.orders ?? -1);
          const forbidden = Number(blocks?.[2]?.results?.[0]?.forbidden_tables ?? -1);
          if (
            latest !== "0008_concurrency_guards.sql" ||
            forbidden !== 0 ||
            orders !== beforeOrders
          ) {
            console.error("Readiness workflow changed Production state.", {
              latest, forbidden, beforeOrders, orders,
            });
            process.exit(1);
          }
          console.log("Production remained unchanged during readiness audit.");
          NODE

      - name: Build cutover readiness report
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync("/tmp/phase6-prod-before.json", "utf8"));
          const staging = JSON.parse(fs.readFileSync("/tmp/phase6-staging-truth-summary.json", "utf8"));
          const exportReport = JSON.parse(fs.readFileSync("/tmp/phase6-cutover/export-report.json", "utf8"));
          const packagePlan = JSON.parse(fs.readFileSync("/tmp/phase6-cutover/package-plan.json", "utf8"));
          const orders = Number(before?.[1]?.results?.[0]?.orders ?? -1);
          const report = {
            ok:
              exportReport.ok === true &&
              packagePlan.ok === true &&
              packagePlan.deterministic === true &&
              (packagePlan.comparison?.unsafeSlugRemovals?.length ?? 1) === 0,
            production: {
              latestMigration: "0008_concurrency_guards.sql",
              orders,
              productInventoryTables: 0,
              commerceAuthorityEnabled: false,
            },
            staging,
            publication: {
              products: exportReport.candidateProducts,
              semanticMismatches: exportReport.semanticMismatchCount,
              retiredSlugAliases: exportReport.retiredSlugAliases,
              packageSha256: packagePlan.packageSha256,
              files: packagePlan.files,
              added: packagePlan.comparison?.added?.length ?? 0,
              changed: packagePlan.comparison?.changed?.length ?? 0,
              deletions: packagePlan.comparison?.deletions?.length ?? 0,
              unsafeSlugRemovals:
                packagePlan.comparison?.unsafeSlugRemovals?.length ?? 0,
            },
            action: "READINESS_ONLY_NO_PRODUCTION_CHANGE",
          };
          fs.writeFileSync(
            "/tmp/phase6-cutover-readiness.json",
            JSON.stringify(report, null, 2) + "\n",
          );
          console.log(JSON.stringify(report, null, 2));
          if (!report.ok) process.exit(1);
          NODE

      - name: Upload cutover readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-production-cutover-readiness
          path: |
            /tmp/phase6-cutover-readiness.json
            /tmp/phase6-prod-before.json
            /tmp/phase6-prod-after.json
            /tmp/phase6-prod-migrations.txt
            /tmp/phase6-staging-truth.json
            /tmp/phase6-cutover/export-report.json
            /tmp/phase6-cutover/package-plan.json
            /tmp/phase6-cutover/activation-report.json
          retention-days: 14

      - name: Safety statement
        if: always()
        run: |
          echo "READ-ONLY CUTOVER READINESS ONLY."
          echo "No wrangler d1 migrations apply command exists in this workflow."
          echo "No production wrangler deploy command exists; Worker build is --dry-run only."
          echo "No Production Product import or storefront package apply is performed."
