name: Commerce Production V2 Migrations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-production-v2-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: 8c5462388648235acd3a41b853d1adee057a11a7

    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@v4
        with:
          ref: 8c5462388648235acd3a41b853d1adee057a11a7
          fetch-depth: 1

      - name: Verify pinned release SHA
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected: $RELEASE_SHA"
          echo "Actual:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Confirm production migrations before apply
        run: npm run db:migrations:list:production

      - name: Apply production migrations
        run: npm run db:migrate:production

      - name: Confirm production migrations after apply
        run: npm run db:migrations:list:production

      - name: Verify Admin V2 production schema and existing orders
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command "
          SELECT COUNT(*) AS orderCount FROM orders;
          SELECT name,type FROM sqlite_master
            WHERE name IN (
              'order_revisions',
              'order_revision_items',
              'order_adjustments',
              'refunds',
              'customer_review_tokens',
              'order_messages',
              'email_webhook_events',
              'idx_refunds_order_idempotency'
            )
            ORDER BY type,name;
          PRAGMA table_info(orders);
          " --json

      - name: Production safety statement
        if: always()
        run: |
          echo "This workflow applies D1 migrations only."
          echo "Pinned release source: $RELEASE_SHA"
          echo "It does not run wrangler deploy."
          echo "It does not alter Worker secrets or DNS."
