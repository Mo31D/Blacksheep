name: One-shot CARD04 Staging Worker Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-card04-staging-worker-deploy.yml"

permissions:
  contents: read

jobs:
  deploy-staging-worker-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: commerce/package.json
      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund
      - name: Validate CARD 04 without remote D1 reads
        run: |
          npm run typecheck
          npm run dynamic-storefront:test
          npm test -- --run
          npm run admin-browser-qa:syntax
          npx wrangler deploy --env staging --dry-run --outdir .wrangler-dist
      - name: Deploy staging Worker only
        run: |
          set -o pipefail
          npx wrangler deploy --env staging 2>&1 | tee /tmp/card04-staging-worker-deploy.log
          if grep -Eq 'api\.theblacksheepshop\.co\.uk|admin\.theblacksheepshop\.co\.uk' /tmp/card04-staging-worker-deploy.log; then
            echo "::error::Staging deploy output referenced a Production custom domain."
            exit 1
          fi
      - name: Verify staging health without D1 query
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health
      - name: Safety statement
        run: |
          echo "CARD 04 Worker-only Staging deployment completed."
          echo "No remote D1 migration/list/execute command ran."
          echo "Production Worker and Production D1 were not modified."
