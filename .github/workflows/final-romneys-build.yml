name: Final Romney static build
on:
  push:
    branches: [romneys-rebuild-2026-09-24]
    paths:
      - assets/catalog.js
      - .github/workflows/final-romneys-build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: romneys-rebuild-2026-09-24
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-romneys-source-map.mjs
      - run: node scripts/build-romneys.mjs
      - run: |
          node scripts/verify-search-readiness.mjs
          node scripts/build-romneys.mjs --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROMNEYS-SOURCE-MAP.md products/ romneys.html all-products.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "romneys: regenerate corrected owner pricing"
            git push origin HEAD:romneys-rebuild-2026-09-24
          fi
