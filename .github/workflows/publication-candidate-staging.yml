name: Phase 6 Publication Candidate Staging

on:
  push:
    branches: [main]
    paths:
      - "commerce/scripts/phase6-publication-candidate.mjs"
      - "commerce/scripts/phase6-publication-render.mjs"
      - "commerce/scripts/phase6-publication-collections.mjs"
      - "commerce/scripts/phase6-publication-verify.mjs"
      - "commerce/scripts/phase6-publication-package.mjs"
      - ".github/workflows/publication-candidate-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Confirm staging schema and production isolation
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging             --remote --env staging --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS active FROM products WHERE publication_status='ACTIVE' AND current_published_version_id IS NOT NULL;"             > /tmp/publication-staging-baseline.json
          cat /tmp/publication-staging-baseline.json
          node - /tmp/publication-staging-baseline.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const active = Number(blocks?.[1]?.results?.[0]?.active ?? -1);
          if (latest !== "0012_order_returns.sql" || active !== 146) {
            console.error("Unexpected staging publication baseline.", { latest, active });
            process.exit(1);
          }
          NODE

          npx wrangler d1 execute black-sheep-commerce-prod             --remote --json             --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS forbidden_tables FROM sqlite_master WHERE type='table' AND name IN ('products','product_variants','inventory_balances','inventory_reservations');"             > /tmp/publication-production-safety.json
          cat /tmp/publication-production-safety.json
          node - /tmp/publication-production-safety.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = String(blocks?.[0]?.results?.[0]?.name ?? "");
          const forbidden = Number(blocks?.[1]?.results?.[0]?.forbidden_tables ?? -1);
          if (latest !== "0008_concurrency_guards.sql" || forbidden !== 0) {
            console.error("Production isolation gate failed.", { latest, forbidden });
            process.exit(1);
          }
          NODE

      - name: Export D1-only publication candidate and require baseline parity
        shell: bash
        run: |
          mkdir -p publication-candidate-artifacts
          node scripts/phase6-publication-candidate.mjs             --remote --env staging             --candidate-out publication-candidate-artifacts/catalog.candidate.js             --manifest-out publication-candidate-artifacts/publication-manifest.json             --report-out publication-candidate-artifacts/report.json             --require-baseline-parity

      - name: Summarize publication candidate
        shell: bash
        run: |
          cat publication-candidate-artifacts/report.json
          node - publication-candidate-artifacts/report.json <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            report.ok !== true ||
            report.activePublishedProducts !== 146 ||
            report.candidateProducts !== 146 ||
            report.semanticMismatchCount !== 0 ||
            report.archivedOrMissing.length !== 0
          ) {
            console.error("Publication candidate gate failed.", report);
            process.exit(1);
          }
          console.log("Phase 6.6 D1-only publication candidate baseline passed.");
          NODE

      - name: Render candidate Product pages and sitemap
        shell: bash
        run: |
          node scripts/phase6-publication-render.mjs \
            --catalog publication-candidate-artifacts/catalog.candidate.js \
            --manifest publication-candidate-artifacts/publication-manifest.json \
            --out-dir publication-candidate-artifacts/site \
            --report-out publication-candidate-artifacts/render-report.json \
            --require-baseline-parity

      - name: Verify rendered publication baseline
        shell: bash
        run: |
          cat publication-candidate-artifacts/render-report.json
          node - publication-candidate-artifacts/render-report.json <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            report.ok !== true ||
            report.candidateProducts !== 146 ||
            report.manifestProducts !== 146 ||
            report.productPages !== 146 ||
            report.existingTemplates !== 146 ||
            report.genericPages !== 0 ||
            report.specialistDetailRegressions.length !== 0 ||
            report.coreMismatches.length !== 0 ||
            report.sitemapProductUrls !== 146
          ) {
            console.error("Rendered publication baseline gate failed.", report);
            process.exit(1);
          }
          console.log("Phase 6.6 Product-page + sitemap candidate baseline passed.");
          NODE

      - name: Render collection and full-range pages from D1 candidate
        shell: bash
        run: |
          node scripts/phase6-publication-collections.mjs             --catalog publication-candidate-artifacts/catalog.candidate.js             --out-dir publication-candidate-artifacts/site             --report-out publication-candidate-artifacts/collections-report.json

      - name: Verify collection rendering baseline
        shell: bash
        run: |
          cat publication-candidate-artifacts/collections-report.json
          node - publication-candidate-artifacts/collections-report.json <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            report.ok !== true ||
            report.collectionPages !== 14 ||
            report.problems.length !== 0
          ) {
            console.error("Collection publication gate failed.", report);
            process.exit(1);
          }
          const full = report.pages.find((page) => page.file === "all-products.html");
          if (!full || full.products !== 146 || full.cardCount !== 146 || full.itemListCount !== 146) {
            console.error("Full-range publication gate failed.", full);
            process.exit(1);
          }
          console.log("Phase 6.6 collection/full-range candidate baseline passed.");
          NODE

      - name: Verify unified publication package
        shell: bash
        run: |
          node scripts/phase6-publication-verify.mjs             --catalog publication-candidate-artifacts/catalog.candidate.js             --manifest publication-candidate-artifacts/publication-manifest.json             --site-dir publication-candidate-artifacts/site             --report-out publication-candidate-artifacts/package-report.json
          cat publication-candidate-artifacts/package-report.json

      - name: Prove deterministic publication package and generate change plan
        shell: bash
        run: |
          node scripts/phase6-publication-package.mjs             --catalog publication-candidate-artifacts/catalog.candidate.js             --manifest publication-candidate-artifacts/publication-manifest.json             --out-dir /tmp/phase6-publication-package             --report-out publication-candidate-artifacts/package-plan.json             --compare-to ..             --check
          cat publication-candidate-artifacts/package-plan.json
          node - publication-candidate-artifacts/package-plan.json <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            report.ok !== true ||
            report.deterministic !== true ||
            report.deterministicDifferences.length !== 0 ||
            (report.comparison?.unsafeSlugRemovals?.length ?? -1) !== 0
          ) {
            console.error("Deterministic publication package gate failed.", report);
            process.exit(1);
          }
          console.log("Deterministic Phase 6 publication package passed.", {
            files: report.files,
            packageSha256: report.packageSha256,
            added: report.comparison?.added?.length ?? 0,
            changed: report.comparison?.changed?.length ?? 0,
            deletions: report.comparison?.deletions?.length ?? 0,
          });
          NODE

      - name: Upload publication candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-publication-candidate-staging
          path: commerce/publication-candidate-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Production safety statement
        if: always()
        run: |
          echo "This workflow performs read-only D1 queries."
          echo "Candidate files are CI artifacts only and do not overwrite storefront files."
          echo "No production D1 migration, Worker deploy, storefront write or order mutation is performed."
