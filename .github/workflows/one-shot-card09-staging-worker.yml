name: One-shot CARD09 Staging Worker

on:
  push:
    paths:
      - ".github/workflows/one-shot-card09-staging-worker.yml"

permissions:
  contents: read

jobs:
  validate-and-deploy-staging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: CARD 09 validation
        run: |
          npm run typecheck
          npx vitest run test/website-appearance-presets.test.ts test/admin-website-appearance.test.ts test/public-website-appearance.test.ts test/admin-html-script.test.ts
          npm run admin-browser-qa:syntax
          npx wrangler deploy --env staging --dry-run --outdir .wrangler-dist
      - name: Deploy Staging Worker only
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --env staging 2>&1 | tee /tmp/card09-staging.log
          if grep -Eq 'api\.theblacksheepshop\.co\.uk|admin\.theblacksheepshop\.co\.uk' /tmp/card09-staging.log; then
            echo "::error::Staging deploy referenced Production custom domain."
            exit 1
          fi
      - name: Health
        run: curl --fail --silent --show-error --retry 3 https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health
      - name: Safety
        run: |
          echo "CARD 09 Staging Worker deployed."
          echo "No D1 migration was required or executed."
          echo "Production was not modified."

