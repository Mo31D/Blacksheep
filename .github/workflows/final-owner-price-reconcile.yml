name: Final owner-price reconciliation
on:
  push:
    branches: [main]
    paths:
      - assets/catalog.js
      - .github/workflows/final-owner-price-reconcile.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node scripts/build-romneys-source-map.mjs
          node scripts/build-romneys.mjs
      - run: |
          node scripts/verify-search-readiness.mjs
          node scripts/build-icecream.mjs --check
          node scripts/build-romneys.mjs --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog.js docs/ROMNEYS-SOURCE-MAP.md all-products.html romneys.html sitemap.xml products/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: reconcile owner-confirmed Kendal Mint Cake prices"
            git push origin HEAD:main
          fi
