name: One-shot Admin Host and Catalogue Fix Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-admin-host-catalogue-fix.yml"

permissions:
  contents: read

concurrency:
  group: black-sheep-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - run: npm install --no-audit --no-fund
      - name: Validate release
        run: npm run check
      - name: Deploy production Worker and custom domains
        run: npm run deploy:production
      - name: Verify API health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 "https://api.theblacksheepshop.co.uk/health" | tee /tmp/health.json
          node - /tmp/health.json <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(h.status!=='ok'||h.environment!=='production'||h.database!=='bound') process.exit(1);
          NODE
      - name: Verify public catalogue category contract
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 "https://api.theblacksheepshop.co.uk/v1/catalog?limit=5" | tee /tmp/catalog.json
          node - /tmp/catalog.json <<'NODE'
          const fs=require('fs'); const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(b.products)||!b.products.length) throw new Error('catalog empty');
          if(!b.products.every(p=>Array.isArray(p.categories))) throw new Error('categories array missing');
          console.log('Public catalogue multi-category contract verified.');
          NODE
      - name: Verify dedicated Admin hostname
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            CODE="$(curl --silent --output /tmp/admin.html --write-out '%{http_code}' --max-time 20 "https://admin.theblacksheepshop.co.uk/" || true)"
            if [ "$CODE" = "200" ] && grep -q "Black Sheep" /tmp/admin.html; then
              echo "Dedicated Admin hostname verified."
              exit 0
            fi
            echo "Admin hostname not ready yet (attempt $attempt/24, HTTP $CODE)."
            sleep 5
          done
          echo "::error::Dedicated Admin hostname did not become ready."
          exit 1
