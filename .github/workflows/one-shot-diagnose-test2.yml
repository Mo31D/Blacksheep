name: One-shot Diagnose Test 2 Publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-diagnose-test2.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Read Test 2 from production D1
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT p.id,p.current_slug,p.publication_status,p.current_published_version_id,p.current_draft_version_id,p.version,p.sell_status,p.online_ordering_enabled,p.updated_at,pv.title,pv.version_number,v.id AS variant_id,v.price_minor,v.active,v.is_default FROM products p LEFT JOIN product_versions pv ON pv.id=COALESCE(p.current_draft_version_id,p.current_published_version_id) LEFT JOIN product_variants v ON v.product_id=p.id AND v.is_default=1 WHERE LOWER(pv.title)=LOWER('Test 2') OR LOWER(p.current_slug)=LOWER('test-2');"
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT p.id AS product_id,pv.id AS version_id,pv.title,c.id AS category_id,c.slug,c.name,c.active,pvc.is_primary,pvc.position FROM products p JOIN product_versions pv ON pv.product_id=p.id LEFT JOIN product_version_categories pvc ON pvc.product_version_id=pv.id LEFT JOIN categories c ON c.id=pvc.category_id WHERE LOWER(pv.title)=LOWER('Test 2') ORDER BY pv.version_number,pvc.position;"
      - name: Read Test 2 audit trail
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT event_type,before_json,after_json,reason,created_at FROM product_audit_events WHERE product_id='prd_09ceee52-eea3-4260-b11f-b9b38cefe49f' ORDER BY created_at ASC;"

      - name: Check public API
        shell: bash
        run: |
          curl --fail --silent --show-error "https://api.theblacksheepshop.co.uk/v1/catalog?q=Test%202&limit=20"

# trigger-2
