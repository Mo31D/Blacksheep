# Phase 3 R2-enabled staging release — 2026-09-25
name: Product Media Staging Phase 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commerce/src/data/product-media.ts"
      - "commerce/src/routes/product-media.ts"
      - "commerce/src/routes/admin.ts"
      - "commerce/src/admin/ui.ts"
      - "commerce/src/index.ts"
      - "commerce/wrangler.jsonc"
      - "commerce/test/product-media-route.test.ts"
      - "commerce/test/admin-products-readonly.test.ts"
      - ".github/workflows/product-media-staging.yml"

permissions:
  contents: read

jobs:
  deploy-product-media-staging:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[product-media-staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_BUCKET: black-sheep-product-media-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Run full Commerce validation
        run: npm run check

      - name: Require enabled R2 and staging media bucket
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
            > /tmp/r2-buckets.json
          node - /tmp/r2-buckets.json "$MEDIA_BUCKET" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const required = process.argv[3];
          if (!data.success) {
            console.error("R2 API did not return success.", data.errors || []);
            process.exit(1);
          }
          const buckets = data.result?.buckets || data.result || [];
          if (!Array.isArray(buckets) || !buckets.some((bucket) => bucket.name === required)) {
            console.error("Required staging R2 bucket is missing:", required);
            process.exit(1);
          }
          console.log("R2 staging bucket gate passed:", required);
          NODE

      - name: Confirm staging Product Core schema
        run: npm run db:migrate:staging

      - name: Guard staging Product Core baseline
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging \
            --remote --env staging --json \
            --command "SELECT COUNT(*) AS product_count FROM products; SELECT COUNT(*) AS imported_count FROM product_audit_events WHERE event_type='PRODUCT_IMPORTED'; SELECT COUNT(*) AS tracked_count FROM product_variants WHERE track_inventory=1;" \
            > /tmp/product-core-guard.json
          node - /tmp/product-core-guard.json <<'NODE'
          const fs = require("fs");
          const blocks = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const products = Number(blocks?.[0]?.results?.[0]?.product_count ?? -1);
          const imported = Number(blocks?.[1]?.results?.[0]?.imported_count ?? -1);
          const tracked = Number(blocks?.[2]?.results?.[0]?.tracked_count ?? -1);
          if (products < 146 || imported !== 146 || tracked !== 0) {
            console.error("Product Core safety gate failed.", { products, imported, tracked });
            process.exit(1);
          }
          console.log("Product Core safety gate passed.");
          NODE

      - name: Deploy Product Media to staging only
        run: npx wrangler deploy --env staging

      - name: Verify staging Worker health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          if (health.status !== "ok" || health.environment !== "staging" || health.database !== "bound") {
            console.error("Staging health gate failed.", health);
            process.exit(1);
          }
          NODE

      - name: Verify media route is live
        shell: bash
        run: |
          STATUS="$(curl --silent --output /tmp/media-missing.json --write-out "%{http_code}" \
            https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/media/nonexistent)"
          cat /tmp/media-missing.json
          test "$STATUS" = "404"

      - name: Verify staging Admin shell
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/admin \
            > /tmp/admin.html
          grep -qi "Admin sign in" /tmp/admin.html

      - name: Safety statement
        if: always()
        run: |
          echo "Phase 3 target: staging only."
          echo "Production Worker/D1/R2 remain untouched."
          echo "Inventory tracking remains disabled."
          echo "No storefront or checkout cutover is performed."
