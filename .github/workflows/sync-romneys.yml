name: Sync Romney images
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact Romney images from Lakeside Picnic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/romneys
          curl -fL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/Mo31D/Lakesidepinicnew/a63b64e5620c9940d5e5b0ba49aa4ce3a792d342/Mintcake/lakelandr.png" -o "images/romneys/lakelandr.png"
          curl -fL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/Mo31D/Lakesidepinicnew/a63b64e5620c9940d5e5b0ba49aa4ce3a792d342/Mintcake/dubai.png" -o "images/romneys/dubai.png"
