name: Reconcile static builders
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-static-builders.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild Romney and ice cream outputs
        run: |
          node scripts/build-romneys-source-map.mjs
          node scripts/build-romneys.mjs
          node scripts/build-icecream.mjs
      - name: Verify both deterministic builders
        run: |
          node scripts/verify-search-readiness.mjs
          node scripts/build-romneys.mjs --check
          node scripts/build-icecream.mjs --check
      - name: Commit reconciled outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROMNEYS-SOURCE-MAP.md romneys.html all-products.html sitemap.xml products/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: reconcile Romney and ice cream static outputs"
            git push origin HEAD:main
          fi
