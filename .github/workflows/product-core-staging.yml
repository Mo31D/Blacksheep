name: Product Core Staging Phase 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commerce/migrations/0009_product_inventory_foundation.sql"
      - "commerce/scripts/product-core-*.mjs"
      - "commerce/src/data/products.ts"
      - "commerce/src/routes/admin.ts"
      - "commerce/src/admin/ui.ts"
      - "commerce/test/admin-products-readonly.test.ts"
      - "commerce/test/admin-html-script.test.ts"
      - "commerce/package.json"
      - ".github/workflows/product-core-staging.yml"

permissions:
  contents: read

jobs:
  stage-product-core:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[product-core-staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Run full Commerce validation
        run: npm run check

      - name: Apply additive Product Core migration to staging only
        run: npm run db:migrate:staging

      - name: Import frozen 146-product catalogue into staging D1
        run: npm run product-core:import:staging

      - name: Verify staging D1 catalogue parity
        run: |
          node scripts/product-core-parity.mjs \
            --remote --env staging \
            --markdown /tmp/product-core-parity.md \
            --json-out /tmp/product-core-parity.json

      - name: Deploy read-only Product Admin to staging only
        run: npx wrangler deploy --env staging

      - name: Verify staging Worker health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const failures = [];
          if (health.status !== "ok") failures.push("status");
          if (health.environment !== "staging") failures.push("environment");
          if (health.database !== "bound") failures.push("database");
          if (failures.length) {
            console.error("Staging health gate failed:", failures.join(", "));
            process.exit(1);
          }
          console.log("Staging health gate passed.");
          NODE

      - name: Verify staging Admin shell
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/admin \
            > /tmp/admin.html
          test -s /tmp/admin.html
          grep -qi "Black Sheep" /tmp/admin.html
          grep -qi "Admin sign in" /tmp/admin.html
          echo "Staging Admin sign-in shell is reachable."

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-core-staging-parity
          path: |
            /tmp/product-core-parity.md
            /tmp/product-core-parity.json
          if-no-files-found: error
          retention-days: 30

      - name: Safety statement
        if: always()
        run: |
          echo "Phase 1 target: staging only."
          echo "No production D1 migration is run by this workflow."
          echo "No production Worker deploy is run by this workflow."
          echo "No Product/Inventory write route is enabled by Phase 1."
