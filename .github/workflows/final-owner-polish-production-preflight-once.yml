name: Final Owner Polish Production Preflight Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-owner-polish-production-preflight-once.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - run: npm install --no-audit --no-fund
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate current source
        run: npm run check
      - name: Read production migration ledger
        run: npm run db:migrations:list:production
      - name: Read production order safety snapshot
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command             "SELECT COUNT(*) AS order_count, MIN(created_at) AS first_order_at, MAX(created_at) AS latest_order_at FROM orders; SELECT COUNT(*) AS active_reservations FROM inventory_reservations WHERE state IN ('ACTIVE','COMMITTED');"             --json > /tmp/prod-preflight.json
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/prod-preflight.json","utf8"));
          const sets = Array.isArray(payload) ? payload : [payload];
          const rows = sets.flatMap(x => x.results || []);
          const order = rows.find(x => Object.prototype.hasOwnProperty.call(x,"order_count"));
          const reservations = rows.find(x => Object.prototype.hasOwnProperty.call(x,"active_reservations"));
          if (!order || Number(order.order_count) !== 4) {
            throw new Error("Production clean-start preflight blocked: expected exactly 4 pre-existing test orders.");
          }
          if (!reservations || Number(reservations.active_reservations) !== 0) {
            throw new Error("Production clean-start preflight blocked: active/committed reservations exist.");
          }
          console.log(JSON.stringify({
            orderCount: Number(order.order_count),
            firstOrderAt: order.first_order_at,
            latestOrderAt: order.latest_order_at,
            activeReservations: Number(reservations.active_reservations)
          }, null, 2));
          NODE
      - name: Production health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/health | tee /tmp/prod-health.json
          echo
          node - <<'NODE'
          const fs = require("fs");
          const h = JSON.parse(fs.readFileSync("/tmp/prod-health.json","utf8"));
          if (h.status !== "ok" || h.environment !== "production" || h.database !== "bound") {
            throw new Error("Production health preflight failed.");
          }
          console.log("Production health preflight PASS.");
          NODE
      - name: Safety statement
        run: |
          echo "Read-only production preflight completed."
          echo "No production migration, deploy, order write, inventory write or reset was performed."
