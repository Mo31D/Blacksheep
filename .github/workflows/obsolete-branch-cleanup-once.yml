name: Obsolete Branch Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/obsolete-branch-cleanup-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify cleanup preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          PR_STATE="$(gh api repos/${GITHUB_REPOSITORY}/pulls/7 --jq .state)"
          if [ "$PR_STATE" != "closed" ]; then
            echo "::error::PR #7 is not closed; refusing branch cleanup."
            exit 1
          fi
          echo "PR #7 is closed; branch cleanup may proceed."

      - name: Delete obsolete historical branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "commerce-v1-catalog"
            "commerce-v1-pricing"
            "commerce-v1"
            "exact-local-v2"
            "recovery/black-sheep-work-2026-09-23"
            "restore-local-exact"
            "romneys-rebuild-2026-09-24"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting obsolete branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Verify only main remains from cleanup target set
        shell: bash
        run: |
          set -euo pipefail
          for branch in             commerce-v1-catalog             commerce-v1-pricing             commerce-v1             exact-local-v2             recovery/black-sheep-work-2026-09-23             restore-local-exact             romneys-rebuild-2026-09-24
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Branch still exists: $branch"
              exit 1
            fi
          done
          git ls-remote --exit-code --heads origin refs/heads/main >/dev/null
          echo "Obsolete branch cleanup passed; main preserved."
