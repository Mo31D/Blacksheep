name: Commerce Staging Checkout Browser E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-staging-checkout-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Install ephemeral browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Actions credentials are unavailable."
            exit 1
          fi

      - name: Confirm staging schema is current
        run: npm run db:migrations:list:staging

      - name: Run public checkout browser E2E against staging API
        run: node scripts/staging-checkout-browser-e2e.mjs

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-checkout-browser-e2e-failure
          path: commerce/browser-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Production safety statement
        if: always()
        run: |
          echo "Static checkout is loaded from the public shop domain only to exercise the real browser UI and Turnstile."
          echo "Order API traffic is redirected by the test to the staging Worker."
          echo "Only black-sheep-commerce-staging D1 cleanup commands are present."
          echo "No production Worker deploy, production D1 migration, or production order write command is present."


