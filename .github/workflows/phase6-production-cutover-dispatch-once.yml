name: Dispatch Approved Phase 6 Production Cutover Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase6-production-cutover-dispatch-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded Production cutover
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          cat > /tmp/dispatch.json <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "confirmation": "CUTOVER-PRODUCTION-D1",
              "expected_package_sha": "61d0b5f8cd4e038d3d6b38fff8bda77fe1bd491fc7f6c796ac59089522d7c3f7"
            }
          }
          JSON

          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/phase6-production-cutover.yml/dispatches"             --data-binary @/tmp/dispatch.json

          echo "Guarded Phase 6 Production cutover dispatched."
