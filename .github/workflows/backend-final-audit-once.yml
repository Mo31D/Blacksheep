name: Backend Final Audit Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-final-audit-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Full Commerce validation
        run: npm run check

      - name: Verify current static/search contract
        working-directory: .
        run: node scripts/verify-search-readiness.mjs

      - name: Enforce cleanup invariants
        working-directory: .
        shell: bash
        run: |
          test ! -e commerce/src/domain/catalog.ts
          test ! -e commerce/src/generated/catalog.ts
          test ! -e scripts/build-commerce-catalog.mjs
          test ! -e scripts/build-icecream.mjs
          test ! -e scripts/build-romneys.mjs
          if git grep -n -E "D1_COMMERCE_AUTHORITY_ENABLED|generated/catalog|COMMERCE_CATALOG|requirePurchasableProduct|priceRequestedCart\\(" -- commerce/src commerce/test commerce/package.json scripts; then
            echo "Legacy backend authority reference found."
            exit 1
          fi
          if git grep -n -E "^# trigger-[0-9]+$" -- .github/workflows; then
            echo "Stale workflow trigger marker found."
            exit 1
          fi
          if git grep -n -E "\\b(TODO|FIXME|HACK)\\b" -- commerce/src commerce/scripts; then
            echo "Unresolved runtime marker found."
            exit 1
          fi
          echo "Cleanup invariants passed."

      - name: Verify post-cutover source configuration
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const config=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const vars=config.vars||{};
          const r2=config.r2_buckets||[];
          const crons=config.triggers?.crons||[];
          const site=fs.readFileSync("../assets/site.js","utf8");
          const failures=[];
          for(const key of ["ORDER_RESERVATIONS_ENABLED","D1_PUBLIC_CATALOG_ENABLED"]){
            if(vars[key]!=="true") failures.push(key+" not enabled");
          }
          if(Object.prototype.hasOwnProperty.call(vars,"D1_COMMERCE_AUTHORITY_ENABLED")){
            failures.push("obsolete D1_COMMERCE_AUTHORITY_ENABLED switch still present");
          }
          if(!r2.some(x=>x.binding==="PRODUCT_MEDIA"&&x.bucket_name==="black-sheep-product-media-prod")){
            failures.push("Production PRODUCT_MEDIA binding missing");
          }
          if(!crons.includes("*/30 * * * *")) failures.push("Production reservation cron missing");
          if(!site.includes("const BLACK_SHEEP_PRODUCTION_LIVE_COMMERCE=true;")){
            failures.push("Production live-commerce marker not enabled");
          }
          if(failures.length){ console.error(failures); process.exit(1); }
          console.log("Post-cutover source configuration passed.");
          NODE

      - name: Require Cloudflare GitHub Actions credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read-only Production D1 integrity
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS active_products FROM products WHERE publication_status='ACTIVE' AND current_published_version_id IS NOT NULL; SELECT COUNT(*) AS active_variants FROM product_variants v JOIN products p ON p.id=v.product_id WHERE p.publication_status='ACTIVE' AND v.is_default=1 AND v.active=1; SELECT COUNT(*) AS orders FROM orders; SELECT COUNT(*) AS active_reservations FROM inventory_reservations WHERE state IN ('ACTIVE','COMMITTED');" \
            > /tmp/final-audit-prod-d1.json
          cat /tmp/final-audit-prod-d1.json
          node - /tmp/final-audit-prod-d1.json <<'NODE'
          const fs=require("fs");
          const b=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const latest=String(b?.[0]?.results?.[0]?.name||"");
          const products=Number(b?.[1]?.results?.[0]?.active_products??-1);
          const variants=Number(b?.[2]?.results?.[0]?.active_variants??-1);
          const orders=Number(b?.[3]?.results?.[0]?.orders??-1);
          const reservations=Number(b?.[4]?.results?.[0]?.active_reservations??-1);
          if(latest!=="0012_order_returns.sql"||products!==146||variants!==146||orders<4||reservations<0){
            console.error({latest,products,variants,orders,reservations});
            process.exit(1);
          }
          console.log("Production D1 integrity passed.",{latest,products,variants,orders,reservations});
          NODE

      - name: Read-only Production health and Admin reachability
        working-directory: .
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const h=JSON.parse(process.argv[2]);
          const failures=[];
          if(h.status!=="ok") failures.push("status");
          if(h.environment!=="production") failures.push("environment");
          if(h.database!=="bound") failures.push("database");
          if(h.features?.orderReservations!==true) failures.push("orderReservations");
          if(h.features?.publicCatalog!==true) failures.push("publicCatalog");
          if(h.features?.commerceAuthority!==true) failures.push("commerceAuthority");
          if(h.notifications?.provider!=="resend") failures.push("resend");
          if(h.notifications?.fromConfigured!==true) failures.push("fromConfigured");
          if(h.notifications?.ownerConfigured!==true) failures.push("ownerConfigured");
          if(h.notifications?.webhookConfigured!==true) failures.push("webhookConfigured");
          if(failures.length){ console.error(failures); process.exit(1); }
          NODE
          curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/admin > /tmp/final-audit-prod-admin.html
          test -s /tmp/final-audit-prod-admin.html
          grep -qi "Black Sheep" /tmp/final-audit-prod-admin.html
          echo "Production Admin route reachable."

      - name: Verify Production public D1 catalogue contract and parity
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://api.theblacksheepshop.co.uk/v1/catalog?limit=200" \
            > /tmp/final-audit-prod-catalog.json
          node - /tmp/final-audit-prod-catalog.json <<'NODE'
          const fs=require("fs");
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(!Array.isArray(p.products)||p.products.length!==146){
            console.error("Unexpected Production public catalogue.",{count:p.products?.length});
            process.exit(1);
          }
          for(const product of p.products){
            for(const privateField of ["costMinor","barcode","supplier","supplierUrl","audit","internalNote","currentDraftVersionId"]){
              if(Object.prototype.hasOwnProperty.call(product,privateField)){
                console.error("Private field leaked.",{id:product.id,privateField});
                process.exit(1);
              }
            }
          }
          console.log("Production public catalogue contract passed.",p.products.length);
          NODE
          PHASE6_PUBLIC_CATALOG_ENDPOINT=https://api.theblacksheepshop.co.uk npm run phase6:catalog-parity

      - name: Confirm staging publication baseline
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-staging --remote --env staging --json \
            --command "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS active_products FROM products WHERE publication_status='ACTIVE' AND current_published_version_id IS NOT NULL;" \
            > /tmp/final-audit-staging-baseline.json
          cat /tmp/final-audit-staging-baseline.json
          node - /tmp/final-audit-staging-baseline.json <<'NODE'
          const fs=require("fs");
          const b=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const latest=String(b?.[0]?.results?.[0]?.name||"");
          const products=Number(b?.[1]?.results?.[0]?.active_products??-1);
          if(latest!=="0012_order_returns.sql"||products!==146){
            console.error({latest,products});
            process.exit(1);
          }
          NODE

      - name: Phase 6 publication candidate and deterministic package
        shell: bash
        run: |
          rm -rf final-audit-publication /tmp/final-audit-package
          mkdir -p final-audit-publication
          node scripts/phase6-publication-candidate.mjs \
            --remote --env staging \
            --candidate-out final-audit-publication/catalog.candidate.js \
            --manifest-out final-audit-publication/publication-manifest.json \
            --report-out final-audit-publication/candidate-report.json \
            --require-baseline-parity
          node scripts/phase6-publication-render.mjs \
            --catalog final-audit-publication/catalog.candidate.js \
            --manifest final-audit-publication/publication-manifest.json \
            --out-dir final-audit-publication/site \
            --report-out final-audit-publication/render-report.json \
            --require-baseline-parity
          node scripts/phase6-publication-collections.mjs \
            --catalog final-audit-publication/catalog.candidate.js \
            --out-dir final-audit-publication/site \
            --report-out final-audit-publication/collections-report.json
          node scripts/phase6-publication-verify.mjs \
            --catalog final-audit-publication/catalog.candidate.js \
            --manifest final-audit-publication/publication-manifest.json \
            --site-dir final-audit-publication/site \
            --report-out final-audit-publication/package-report.json
          node scripts/phase6-publication-package.mjs \
            --catalog final-audit-publication/catalog.candidate.js \
            --manifest final-audit-publication/publication-manifest.json \
            --out-dir /tmp/final-audit-package \
            --report-out final-audit-publication/package-plan.json \
            --compare-to .. \
            --check

      - name: Admin Add Publish Archive publication E2E
        run: node scripts/staging-publication-admin-e2e.mjs

      - name: Admin V2 staging E2E
        run: node scripts/staging-v2-e2e.mjs

      - name: Customer-review edge-case staging E2E
        run: node scripts/staging-review-edge-e2e.mjs

      - name: Resend webhook staging E2E
        run: node scripts/staging-webhook-event-e2e.mjs

      - name: Install ephemeral browser audit dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Shopping basket and checkout browser E2E
        run: node scripts/staging-checkout-browser-e2e.mjs

      - name: Admin browser QA
        run: node scripts/staging-admin-browser-qa.mjs

      - name: Storefront live-overlay browser QA
        run: node scripts/staging-storefront-overlay-qa.mjs

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-final-audit-artifacts
          path: |
            commerce/final-audit-publication
            commerce/browser-e2e-artifacts
            commerce/admin-browser-qa-artifacts
            commerce/storefront-overlay-qa-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Safety statement
        if: always()
        run: |
          echo "Production checks are read-only."
          echo "Synthetic mutation E2Es target staging only and use their cleanup logic."
          echo "No Production deploy, migration, INSERT, UPDATE, DELETE, secret mutation or rollback command is present."
