name: Commerce Release State Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-release-state.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install commerce dependencies
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials: AVAILABLE"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Actions credentials are unavailable. Release-state facts remain UNVERIFIED."
          fi

      - name: Staging Worker deployment status
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "::group::STAGING_WORKER_STATUS"
          npx wrangler deployments status --env staging --json
          echo "::endgroup::"

      - name: Staging Worker deployment history
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "::group::STAGING_WORKER_DEPLOYMENTS"
          npx wrangler deployments list --env staging --json
          echo "::endgroup::"

      - name: Production Worker deployment status
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "::group::PRODUCTION_WORKER_STATUS"
          npx wrangler deployments status --json
          echo "::endgroup::"

      - name: Production Worker deployment history
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "::group::PRODUCTION_WORKER_DEPLOYMENTS"
          npx wrangler deployments list --json
          echo "::endgroup::"

      - name: Staging D1 migration state
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "::group::STAGING_D1_MIGRATIONS"
          npm run db:migrations:list:staging
          echo "::endgroup::"

      - name: Production D1 migration state
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "::group::PRODUCTION_D1_MIGRATIONS"
          npm run db:migrations:list:production
          echo "::endgroup::"

      - name: Production public health
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::PRODUCTION_HEALTH"
          curl --fail --silent --show-error --max-time 20 https://api.theblacksheepshop.co.uk/health
          echo
          echo "::endgroup::"

      - name: CARD 14 Cloudflare zone read-only diagnosis
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::CLOUDFLARE_ZONE"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=theblacksheepshop.co.uk" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);for(const z of j.result||[]) console.log(JSON.stringify({id:z.id,name:z.name,status:z.status,paused:z.paused,type:z.type,name_servers:z.name_servers,original_name_servers:z.original_name_servers},null,2))})'
          echo "::endgroup::"

          ZONE_ID="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=theblacksheepshop.co.uk" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.result?.[0]?.id||"")})')"
          if [ -n "$ZONE_ID" ]; then
            echo "::group::CLOUDFLARE_DNS"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);for(const r of j.result||[]) if(["theblacksheepshop.co.uk","www.theblacksheepshop.co.uk"].includes(r.name)) console.log(JSON.stringify({id:r.id,type:r.type,name:r.name,content:r.content,proxied:r.proxied,proxiable:r.proxiable,ttl:r.ttl},null,2))})'
            echo "::endgroup::"
          fi

      - name: CARD 14 Production Storefront Structure read-only diagnosis
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::PRODUCTION_STOREFRONT_NODES"
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT n.id,n.stable_key,n.publication_status,n.current_published_version_id,v.slug,v.legacy_path FROM storefront_nodes n LEFT JOIN storefront_node_versions v ON v.id=n.current_published_version_id ORDER BY n.id" --json
          echo "::endgroup::"
          echo "::group::PRODUCTION_PUBLIC_STRUCTURE"
          curl --silent --show-error --max-time 20 https://api.theblacksheepshop.co.uk/v1/storefront-structure
          echo
          echo "::endgroup::"
          echo "::group::PRODUCTION_COLLECTION_GIFTS"
          curl --silent --show-error --max-time 20 -D - https://theblacksheepshop.co.uk/collections/gifts
          echo
          echo "::endgroup::"
          echo "::group::PRODUCTION_SITEMAP_HEAD"
          curl --silent --show-error --max-time 20 https://theblacksheepshop.co.uk/sitemap.xml | head -80
          echo
          echo "::endgroup::"

      - name: CARD 14 final live routing verification
        if: steps.cloudflare.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZONE_ID="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=theblacksheepshop.co.uk" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.result?.[0]?.id||"")})')"
          test -n "$ZONE_ID"

          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" > /tmp/dns-final.json
          node <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/dns-final.json","utf8"));
          const web=(j.result||[]).filter(r=>["theblacksheepshop.co.uk","www.theblacksheepshop.co.uk"].includes(r.name)&&["A","CNAME"].includes(r.type));
          if(web.length!==5 || web.some(r=>r.proxied!==true)) throw new Error("Storefront web DNS is not fully proxied");
          console.log("DNS PASS: 5/5 storefront web records proxied.");
          NODE

          curl --silent --show-error --max-time 30 -D /tmp/card14-gifts.headers -o /tmp/card14-gifts.body "https://theblacksheepshop.co.uk/collections/gifts"
          code="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/card14-gifts.headers)"
          location="$(tr -d '\r' < /tmp/card14-gifts.headers | awk 'tolower($1)=="location:" {print $2}' | tail -1)"
          test "$code" = "301"
          test "$location" = "https://theblacksheepshop.co.uk/gifts.html"

          curl --fail --silent --show-error --max-time 30 "https://theblacksheepshop.co.uk/collections/chutneys-pickles" > /tmp/card14-dynamic.html
          grep -Fq 'rel="canonical" href="https://theblacksheepshop.co.uk/collections/chutneys-pickles"' /tmp/card14-dynamic.html

          curl --fail --silent --show-error --max-time 30 "https://theblacksheepshop.co.uk/sitemap.xml" > /tmp/card14-sitemap.xml
          grep -Fq '<loc>https://theblacksheepshop.co.uk/collections/chutneys-pickles</loc>' /tmp/card14-sitemap.xml
          grep -Fq '<loc>https://theblacksheepshop.co.uk/gifts.html</loc>' /tmp/card14-sitemap.xml
          ! grep -Fq 'product.html?' /tmp/card14-sitemap.xml

          echo "CARD 14 live routing PASS."

      - name: Audit note
        run: |
          echo "This workflow is intentionally read-only."
          echo "It does not run wrangler deploy or wrangler d1 migrations apply."

