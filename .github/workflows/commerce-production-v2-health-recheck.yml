name: Commerce Production V2 Health Recheck

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commerce-production-v2-health-recheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production health
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/health)"
          echo "$HEALTH"
          node - "$HEALTH" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const failures = [];
          if (health.status !== "ok") failures.push("status");
          if (health.environment !== "production") failures.push("environment");
          if (health.database !== "bound") failures.push("database");
          if (health.notifications?.provider !== "resend") failures.push("provider");
          if (health.notifications?.fromConfigured !== true) failures.push("fromConfigured");
          if (health.notifications?.ownerConfigured !== true) failures.push("ownerConfigured");
          if (health.notifications?.webhookConfigured !== true) failures.push("webhookConfigured");
          if (health.notifications?.keyFormatValid !== true) failures.push("keyFormatValid");
          if (health.notifications?.keyWhitespaceNormalized !== true) failures.push("keyWhitespaceNormalized");
          if (failures.length) {
            console.error("Production health recheck failed:", failures.join(", "));
            process.exit(1);
          }
          console.log("Production health recheck passed.");
          NODE

      - name: Verify production Admin page
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/admin > /tmp/admin.html
          test -s /tmp/admin.html
          grep -qi "Black Sheep" /tmp/admin.html
          echo "Production Admin page is reachable."

      - name: Safety statement
        if: always()
        run: |
          echo "This workflow is read-only."
          echo "It does not deploy Workers, mutate D1, change secrets, or enable webhooks."
