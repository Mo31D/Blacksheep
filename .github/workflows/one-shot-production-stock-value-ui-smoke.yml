name: One-shot Production Stock Value UI Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-production-stock-value-ui-smoke.yml"

permissions:
  contents: read

jobs:
  production-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install browser dependency
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production Admin mobile smoke
        run: |
          node --input-type=module <<'NODE'
          import { createHash, randomBytes } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import { chromium } from "playwright";

          const BASE = "https://api.theblacksheepshop.co.uk";
          const DB = "black-sheep-commerce-prod";
          let token = "";
          let tokenHash = "";

          function assert(value, message) {
            if (!value) throw new Error(message);
          }

          function q(value) {
            return "'" + String(value).replaceAll("'", "''") + "'";
          }

          function d1(sql) {
            const result = spawnSync(
              "npx",
              [
                "wrangler",
                "d1",
                "execute",
                DB,
                "--remote",
                "--command",
                sql,
                "--json",
              ],
              {
                encoding: "utf8",
                env: process.env,
                maxBuffer: 16 * 1024 * 1024,
              },
            );
            if (result.error) throw result.error;
            if (result.status !== 0) {
              throw new Error(
                "Production D1 smoke command failed: " +
                  String(result.stderr || result.stdout || "").slice(-3000),
              );
            }
            const parsed = JSON.parse(result.stdout.trim());
            const batches = Array.isArray(parsed) ? parsed : [parsed];
            return batches.flatMap((part) => part.results || []);
          }

          function seedSession() {
            let rows = d1(
              "SELECT email FROM admin_sessions ORDER BY created_at DESC LIMIT 1",
            );
            if (!rows.length) {
              rows = d1(
                "SELECT email FROM admin_login_codes ORDER BY created_at DESC LIMIT 1",
              );
            }
            assert(rows.length && rows[0].email, "No production owner identity is available.");

            token = randomBytes(32).toString("base64url");
            tokenHash = createHash("sha256").update(token).digest("hex");
            const now = new Date().toISOString();
            const expires = new Date(Date.now() + 30 * 60 * 1000).toISOString();
            d1(
              "INSERT INTO admin_sessions (token_hash,email,expires_at,created_at) VALUES (" +
                [
                  q(tokenHash),
                  q(rows[0].email),
                  q(expires),
                  q(now),
                ].join(",") +
                ")",
            );
          }

          function cleanupSession() {
            if (tokenHash) {
              d1("DELETE FROM admin_sessions WHERE token_hash=" + q(tokenHash));
            }
          }

          async function noOverflow(page, label) {
            const widths = await page.evaluate(() => ({
              viewport: innerWidth,
              document: document.documentElement.scrollWidth,
              body: document.body.scrollWidth,
            }));
            assert(
              widths.document <= widths.viewport + 2 &&
                widths.body <= widths.viewport + 2,
              label + " horizontal overflow: " + JSON.stringify(widths),
            );
          }

          let browser;
          try {
            seedSession();

            browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
            });
            await context.addCookies([
              {
                name: "bs_admin_session",
                value: token,
                domain: "api.theblacksheepshop.co.uk",
                path: "/admin",
                secure: true,
                httpOnly: true,
                sameSite: "Strict",
              },
            ]);

            const page = await context.newPage();
            await page.goto(BASE + "/admin#products", {
              waitUntil: "domcontentloaded",
              timeout: 60_000,
            });
            await page.waitForSelector("#view-products", { timeout: 20_000 });
            await page.locator('.mobile-nav[data-nav="products"]').click();
            await page.waitForFunction(
              () => document.querySelectorAll("#productList .product-row").length > 0,
              null,
              { timeout: 20_000 },
            );

            await page.locator("#addProduct").click();
            await page.waitForSelector("#newProductTitle", { timeout: 10_000 });
            assert((await page.locator("#newProductCost").count()) === 1, "Cost field missing.");
            assert((await page.locator("#newProductVat").inputValue()) === "20", "VAT default is wrong.");
            assert((await page.locator("#newProductSupplier").count()) === 1, "Supplier field missing.");
            assert((await page.locator("#newProductSupplierCode").count()) === 1, "Supplier code field missing.");

            await page.locator(".product-editor-panel").evaluate((panel) => {
              panel.scrollTop = panel.scrollHeight;
            });
            await page.waitForTimeout(150);
            const clearance = await page.evaluate(() => {
              const actions = document.querySelector(".editor-actions");
              const choices = Array.from(
                document.querySelectorAll("#newProductCategories .category-choice"),
              );
              const last = choices.at(-1);
              if (!actions || !last) return null;
              const a = actions.getBoundingClientRect();
              const l = last.getBoundingClientRect();
              return { actionTop: a.top, lastBottom: l.bottom };
            });
            assert(clearance, "Could not measure Add Product footer clearance.");
            assert(
              clearance.lastBottom <= clearance.actionTop + 2,
              "Add Product actions overlap final categories: " + JSON.stringify(clearance),
            );
            await noOverflow(page, "Production Add Product");
            await page.locator("[data-close-product-sheet]:visible").first().click();

            await page.locator('.mobile-nav[data-nav="stock"]').click();
            await page.waitForFunction(
              () => document.querySelectorAll("#stockList .product-row").length > 0,
              null,
              { timeout: 20_000 },
            );
            await page.locator("#stockValueButton").click();
            await page.waitForSelector(
              "#view-stock-value.active #valuationMetrics .valuation-card",
              { timeout: 30_000 },
            );
            const text = (
              await page.locator("#view-stock-value").innerText()
            ).toLowerCase();
            for (const expected of [
              "stock at cost",
              "retail value",
              "potential gross profit",
              "value by supplier",
              "valuation confidence",
            ]) {
              assert(text.includes(expected), "Stock Value missing: " + expected);
            }
            await noOverflow(page, "Production Stock Value");

            const valuation = await page.evaluate(async () => {
              const response = await fetch("/admin/api/inventory/valuation?days=90", {
                headers: { accept: "application/json" },
                cache: "no-store",
              });
              if (!response.ok) throw new Error("valuation API " + response.status);
              return response.json();
            });
            assert(valuation?.summary, "Valuation summary missing.");
            assert(
              Number(valuation.summary.totalVariants || 0) > 0,
              "Valuation report has no product variants.",
            );

            fs.mkdirSync("production-stock-value-smoke", { recursive: true });
            await page.screenshot({
              path: "production-stock-value-smoke/stock-value-mobile.png",
              fullPage: true,
            });

            console.log(
              JSON.stringify(
                {
                  ok: true,
                  checks: [
                    "production-add-product-cost-supplier",
                    "production-add-product-footer-clearance",
                    "production-stock-value-page",
                    "production-stock-value-api",
                    "production-mobile-no-horizontal-overflow",
                  ],
                  valuationSummary: {
                    totalVariants: valuation.summary.totalVariants,
                    trackedVariants: valuation.summary.trackedVariants,
                    onHandUnits: valuation.summary.onHandUnits,
                    actualCostVariants: valuation.summary.actualCostVariants,
                    estimatedCostVariants: valuation.summary.estimatedCostVariants,
                    missingValuationVariants: valuation.summary.missingValuationVariants,
                    trackedCoverage: valuation.summary.trackedCoverage,
                    costCoverage: valuation.summary.costCoverage,
                    actualCostCoverage: valuation.summary.actualCostCoverage,
                  },
                },
                null,
                2,
              ),
            );

            await context.close();
          } finally {
            if (browser) await browser.close();
            cleanupSession();
          }
          NODE

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-stock-value-ui-smoke
          path: commerce/production-stock-value-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Safety statement
        if: always()
        run: |
          echo "The production smoke creates only a temporary admin session and removes it in finally."
          echo "It does not create/edit/archive products, change costs, submit orders or adjust inventory."
          echo "Opening Stock Value may upsert today's intended valuation snapshot; no inventory quantities are changed."
