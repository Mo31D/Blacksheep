name: One-shot Platform CARD 00 Baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-platform-card00-baseline.yml"

permissions:
  contents: read
  statuses: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - name: Install
        working-directory: commerce
        run: npm install --no-audit --no-fund

      - name: Production health and public catalogue
        run: |
          echo "=== HEALTH ==="
          curl --fail --silent --show-error "https://api.theblacksheepshop.co.uk/health"
          echo
          echo "=== PUBLIC CATALOG FIRST PAGE ==="
          curl --fail --silent --show-error "https://api.theblacksheepshop.co.uk/v1/catalog?limit=200" > /tmp/catalog.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const x=JSON.parse(fs.readFileSync("/tmp/catalog.json","utf8"));
          console.log(JSON.stringify({
            firstPageCount:(x.products||[]).length,
            nextCursor:x.nextCursor||null,
            types:[...new Set((x.products||[]).map(p=>p.type))].sort(),
            dynamicWithoutImage:(x.products||[]).filter(p=>!p.primaryImageUrl).length
          },null,2));
          NODE

      - name: Production D1 architecture snapshot
        working-directory: commerce
        run: |
          echo "=== MIGRATIONS ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT id,name,applied_at FROM d1_migrations ORDER BY id;"
          echo "=== PRODUCT STATES ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT publication_status,COUNT(*) AS count FROM products GROUP BY publication_status ORDER BY publication_status;"
          echo "=== CATEGORIES ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT category_type,active,COUNT(*) AS count,SUM(CASE WHEN parent_id IS NOT NULL THEN 1 ELSE 0 END) AS with_parent FROM categories GROUP BY category_type,active ORDER BY category_type,active DESC;"
          echo "=== RELATIONSHIPS ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT (SELECT COUNT(*) FROM product_versions) AS product_versions,(SELECT COUNT(*) FROM product_version_categories) AS version_category_links,(SELECT COUNT(*) FROM product_media WHERE deleted_at IS NULL) AS active_product_media,(SELECT COUNT(*) FROM product_media WHERE deleted_at IS NULL AND storage_provider='R2') AS active_r2_media,(SELECT COUNT(*) FROM product_media WHERE deleted_at IS NULL AND storage_provider='LEGACY_REPO') AS active_repo_media;"
          echo "=== INVENTORY ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT (SELECT COUNT(*) FROM product_variants WHERE active=1) AS active_variants,(SELECT COUNT(*) FROM product_variants WHERE active=1 AND track_inventory=1) AS tracked_variants,(SELECT COUNT(*) FROM inventory_balances) AS balances,(SELECT COALESCE(SUM(on_hand),0) FROM inventory_balances) AS on_hand_units,(SELECT COALESCE(SUM(reserved),0) FROM inventory_balances) AS reserved_units;"
          echo "=== ORDERS ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT data_class,COUNT(*) AS count FROM orders GROUP BY data_class ORDER BY data_class;"
          echo "=== CORE TABLES ==="
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'product%' OR name LIKE 'inventory%' OR name LIKE 'order%' OR name LIKE 'categories' OR name LIKE 'suppliers') ORDER BY name;"

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESC="CARD 00 Production architecture baseline captured"; else STATE=failure; DESC="CARD 00 Production baseline failed"; fi
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "{\"state\":\"$STATE\",\"context\":\"platform-card00-baseline\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
