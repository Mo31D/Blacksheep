name: Final Owner Polish Production Deploy Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-owner-polish-production-deploy-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - run: npm install --no-audit --no-fund
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Full source validation
        run: npm run check
      - name: Guard production clean-start snapshot
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command             "SELECT COUNT(*) AS order_count, MAX(created_at) AS latest_order_at FROM orders; SELECT COUNT(*) AS active_reservations FROM inventory_reservations WHERE state IN ('ACTIVE','COMMITTED');"             --json > /tmp/prod-before.json
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/prod-before.json","utf8"));
          const rows = (Array.isArray(payload) ? payload : [payload]).flatMap(x => x.results || []);
          const order = rows.find(x => Object.prototype.hasOwnProperty.call(x,"order_count"));
          const reservations = rows.find(x => Object.prototype.hasOwnProperty.call(x,"active_reservations"));
          if (!order || Number(order.order_count) !== 6) {
            throw new Error("Production deploy blocked: order count changed after the verified owner clean-start snapshot.");
          }
          if (String(order.latest_order_at || "") !== "2026-09-26T13:22:34.424Z") {
            throw new Error("Production deploy blocked: a newer order exists than the verified clean-start snapshot.");
          }
          if (!reservations || Number(reservations.active_reservations) !== 0) {
            throw new Error("Production deploy blocked: active/committed reservations exist.");
          }
          console.log("Production clean-start guard PASS: 6 confirmed test orders, 0 active reservations.");
          NODE
      - name: Confirm only owner-polish migration is pending
        shell: bash
        run: |
          npm run db:migrations:list:production | tee /tmp/prod-migrations.txt
          grep -q "0013_order_data_class.sql" /tmp/prod-migrations.txt
      - name: Apply production migration 0013
        run: npm run db:migrate:production
      - name: Verify clean-start data state
        shell: bash
        run: |
          npx wrangler d1 execute black-sheep-commerce-prod --remote --command             "SELECT COUNT(*) AS total_orders FROM orders; SELECT COUNT(*) AS visible_business_orders FROM orders WHERE data_class='BUSINESS' AND admin_hidden_at IS NULL; SELECT COUNT(*) AS hidden_test_orders FROM orders WHERE data_class IN ('TEST','E2E') AND admin_hidden_at IS NOT NULL; SELECT COUNT(*) AS active_reservations FROM inventory_reservations WHERE state IN ('ACTIVE','COMMITTED');"             --json > /tmp/prod-after.json
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/prod-after.json","utf8"));
          const rows = (Array.isArray(payload) ? payload : [payload]).flatMap(x => x.results || []);
          const get = (key) => Number((rows.find(x => Object.prototype.hasOwnProperty.call(x,key)) || {})[key] ?? -1);
          const state = {
            totalOrders: get("total_orders"),
            visibleBusinessOrders: get("visible_business_orders"),
            hiddenTestOrders: get("hidden_test_orders"),
            activeReservations: get("active_reservations")
          };
          console.log(JSON.stringify(state,null,2));
          if (state.totalOrders !== 6 || state.visibleBusinessOrders !== 0 || state.hiddenTestOrders !== 6 || state.activeReservations !== 0) {
            throw new Error("Production clean-start verification failed after migration.");
          }
          NODE
      - name: Deploy production Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/prod-deploy.log
      - name: Verify production migration ledger
        run: npm run db:migrations:list:production
      - name: Verify production health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 https://api.theblacksheepshop.co.uk/health | tee /tmp/prod-health.json
          echo
          node - <<'NODE'
          const fs = require("fs");
          const h = JSON.parse(fs.readFileSync("/tmp/prod-health.json","utf8"));
          if (h.status !== "ok" || h.environment !== "production" || h.database !== "bound") {
            throw new Error("Production health verification failed.");
          }
          if (!h.features?.orderReservations || !h.features?.publicCatalog || !h.features?.commerceAuthority) {
            throw new Error("Production commerce authority flags are not healthy.");
          }
          console.log("Production health PASS.");
          NODE
      - name: Verify production catalogue count
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 "https://api.theblacksheepshop.co.uk/v1/catalog?limit=200" > /tmp/prod-catalog.json
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/prod-catalog.json","utf8"));
          const products = payload.products || payload.items || [];
          if (!Array.isArray(products) || products.length !== 146) {
            throw new Error("Production catalogue count is not 146.");
          }
          console.log("Production catalogue PASS: 146 products.");
          NODE
      - name: Final safety statement
        run: |
          echo "Final Owner Polish production deploy completed."
          echo "The six pre-existing confirmed test orders are preserved as hidden TEST history."
          echo "Future production orders default to BUSINESS and remain visible in normal Admin views."
          echo "Products, Product Media and inventory history were not reset."
