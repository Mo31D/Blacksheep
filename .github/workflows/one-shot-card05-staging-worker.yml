name: One-shot CARD05 Staging Worker

on:
  push:
    paths:
      - ".github/workflows/one-shot-card05-staging-worker.yml"

permissions:
  contents: read

jobs:
  deploy-staging-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate latest Admin build
        run: |
          npm run typecheck
          npm run admin-browser-qa:syntax
          npx wrangler deploy --env staging --dry-run --outdir .wrangler-dist
      - name: Deploy Staging Worker only
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --env staging 2>&1 | tee /tmp/card05-staging.log
          if grep -Eq 'api\.theblacksheepshop\.co\.uk|admin\.theblacksheepshop\.co\.uk' /tmp/card05-staging.log; then
            echo "::error::Staging deploy referenced Production custom domain."
            exit 1
          fi
      - name: Health
        run: curl --fail --silent --show-error --retry 3 https://black-sheep-commerce-api-staging.ky6vfb55p9.workers.dev/health
      - name: Safety
        run: |
          echo "Staging Worker only. D1 was not modified."
          echo "Production was not modified."
