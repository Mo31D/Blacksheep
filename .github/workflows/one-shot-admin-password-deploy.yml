name: One-shot Admin Password Auth Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-admin-password-deploy.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: black-sheep-production-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: commerce/package.json

      - name: Install dependencies
        working-directory: commerce
        run: npm install --no-audit --no-fund

      - name: Validate release
        working-directory: commerce
        run: npm run check

      - name: Deploy production Worker and apply D1 migrations
        working-directory: commerce
        run: npm run deploy:production

      - name: Verify production health
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://api.theblacksheepshop.co.uk/health" | tee /tmp/health.json
          node - /tmp/health.json <<'NODE'
          const fs = require("fs");
          const h = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (h.status !== "ok" || h.environment !== "production" || h.database !== "bound") {
            throw new Error("Production health contract failed.");
          }
          NODE

      - name: Verify Admin password UI is live
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://admin.theblacksheepshop.co.uk/" -o /tmp/admin.html
          grep -Fq "Use password" /tmp/admin.html
          grep -Fq "Sign in with password" /tmp/admin.html

      - name: Verify Admin password endpoint is live
        run: |
          CODE="$(curl --silent --show-error --output /tmp/password-probe.json \
            --write-out '%{http_code}' --max-time 30 \
            -H 'content-type: application/json' \
            -d '{"password":"__deployment_probe_invalid__"}' \
            "https://admin.theblacksheepshop.co.uk/admin/auth/password")"
          cat /tmp/password-probe.json
          case "$CODE" in
            401|429|503) ;;
            *) echo "::error::Unexpected password endpoint status: $CODE"; exit 1 ;;
          esac
          node - /tmp/password-probe.json <<'NODE'
          const fs = require("fs");
          const b = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const code = b?.error?.code;
          const allowed = new Set([
            "admin_password_invalid",
            "admin_password_locked",
            "admin_password_not_configured"
          ]);
          if (!allowed.has(code)) throw new Error("Unexpected password endpoint response: " + code);
          NODE

      - name: Verify production D1 password security state
        working-directory: commerce
        run: |
          npx --no-install wrangler d1 execute black-sheep-commerce-prod --remote \
            --command "SELECT id, failed_attempts, locked_until, updated_at FROM admin_password_security WHERE id='owner';" \
            | tee /tmp/admin-password-db.txt
          grep -Fq "owner" /tmp/admin-password-db.txt

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESC="Admin password authentication deployed and verified"
          else
            STATE="failure"
            DESC="Admin password authentication deploy verification failed"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"admin-password-production\",\"description\":\"$DESC\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
